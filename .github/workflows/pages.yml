#  Publish the portals — and only the portals.
#
#  Until this existed, Pages served the repository root, so everything in the
#  repo was on the public internet whether it was meant to be or not:
#  CLAUDE.md, COMPLETE-APPS-SCRIPT.gs and tools/ all returned 200 on the live
#  site. Making the repository private does NOT fix that by itself — a public
#  Pages site serves whatever is in the published output regardless of who can
#  see the repository. The allowlist below is what actually keeps the backend
#  source and the design docs off the web.
#
#  The rule: the published site is the HTML portals, the images they
#  reference, and nothing else. No *.md, no *.gs, no tools/, no hooks/, no
#  dotfiles except .nojekyll. Nothing is moved or renamed to achieve that —
#  the repository layout is untouched and the site is assembled into _site/
#  at build time.
#
#  The check step is the point. An intention to exclude things drifts; a build
#  that fails when something unexpected reaches _site/ does not.

name: Deploy portals to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site

          # The portals in use this year, named one by one.
          #
          # This was every *.html at the root, which published nine pages nobody
          # is using — among them two superseded G10-12 portals and last year's
          # G9 set, all of which call the older ungated endpoints. A page that is
          # not being used is not worth the exposure, and the ones left out are
          # not deleted: they stay in the repository and come back by adding a
          # line here once they have been brought up to the current auth.
          #
          # Left out deliberately, and why:
          #   index.html                  last year's G9 dashboard
          #   strength-portal.html        \ to be folded into g9-portal
          #   grit-portal.html            /
          #   clash.html                  Clash of the Codes, same plan
          #   academy-portal.html         abandoned first G10-12 shell (Sept 2026)
          #   athlete-portal.html         the G10-12 portal portal-lab replaced
          #   fuel-lab.html               wanted later in the year
          #   apply.html, nominate.html   wanted later in the year
          #   *-prototype.html            design references, never student-facing
          for page in \
            portal-lab.html \
            g9-portal.html \
            admin.html \
            guide.html \
            profile-mockup.html
          do
            if [ -f "$page" ]; then cp "$page" _site/; else
              echo "::error::$page is in the publish list but not in the repository."
              exit 1
            fi
          done

          # The images the portals reference from the root
          # (strength-squat.jpg and friends, WarriorsKit.png).
          find . -maxdepth 1 -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \
            -o -iname '*.gif' -o -iname '*.svg' -o -iname '*.webp' \
            -o -iname '*.ico' \) -exec cp -t _site/ {} +

          # The assets folder, whole — the sport icons are referenced by
          # name built at runtime, so picking through them statically would
          # drop the ones only JavaScript knows about.
          if [ -d assets ]; then cp -R assets _site/assets; fi

          # Pages runs Jekyll over the output otherwise, which silently drops
          # anything starting with an underscore.
          touch _site/.nojekyll

      - name: Refuse to publish anything that is not a site file
        run: |
          set -euo pipefail

          # An allowlist, not a denylist. A denylist only catches the things
          # we thought of. Root files are already safe by construction — only
          # *.html and images are copied from there — so this is really
          # guarding assets/, which is copied whole. Verified to fail on a
          # stray .md, a .env and a creds.json dropped into assets/.
          leaked=$(find _site -type f \
            ! -name '.nojekyll' \
            ! -name '*.html' \
            ! -iname '*.png'  ! -iname '*.jpg' ! -iname '*.jpeg' \
            ! -iname '*.gif'  ! -iname '*.svg' ! -iname '*.webp' \
            ! -iname '*.ico')

          if [ -n "$leaked" ]; then
            echo "::error::These reached the published site and must not be there:"
            echo "$leaked"
            exit 1
          fi

          # The other direction: an empty or gutted publish would also pass a
          # leak check, and would take the portals offline silently.
          for required in portal-lab.html g9-portal.html admin.html; do
            if [ ! -f "_site/$required" ]; then
              echo "::error::$required is missing from the published site."
              exit 1
            fi
          done

          # And the pages that are meant to be archived must stay archived. A
          # publish list is easy to add to by reflex; this makes putting one of
          # these back a deliberate act with a failing build in the way of it.
          for archived in index.html athlete-portal.html academy-portal.html \
                          strength-portal.html grit-portal.html clash.html \
                          fuel-lab.html apply.html nominate.html; do
            if [ -f "_site/$archived" ]; then
              echo "::error::$archived is archived and must not be published — it still calls the ungated endpoints."
              exit 1
            fi
          done

          pages=$(find _site -type f -name '*.html' | wc -l)
          imgs=$(find _site -type f ! -name '*.html' ! -name '.nojekyll' | wc -l)
          echo "Publishing $pages portals and $imgs images."

      # Only on main. configure-pages asks GitHub for the site's settings and
      # fails if Pages is not set to "GitHub Actions" as its source, which is
      # not something a pull request should be blocked on.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Split from the build so the allowlist check runs on pull requests too,
  # where there is nothing to deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
