<title>Intro to Training Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#fbfaf7; --sheet:#ffffff; --ink:#18161a; --ink-2:#4b4750; --mute:#8a8590; --rule:#e6e2dc; --rule-2:#cfc9c1;
    --accent:#874B46; --accent-soft:#f4ebe9; --mark:#b8922a;
  }
  *{box-sizing:border-box}
  html,body{background:var(--paper)}
  body{margin:0;color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
  .cond{font-family:'Barlow Condensed','Arial Narrow',Inter,sans-serif}
  button{font-family:inherit}

  /* ---------- unit strip ---------- */
  .strip{display:flex;align-items:center;gap:22px;padding:14px 28px;border-bottom:1px solid var(--rule);background:var(--sheet);flex-wrap:wrap}
  .wordmark{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
  .wordmark span{color:var(--accent)}
  .unit{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .timeline{display:flex;align-items:flex-end;gap:4px;flex:1;min-width:300px;overflow-x:auto;padding:4px 2px}
  .blk{display:flex;flex-direction:column;gap:5px;padding-right:12px;margin-right:8px;border-right:1px solid var(--rule)}
  .blk:last-child{border-right:none}
  .blk .bl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
  .blk .ss{display:flex;gap:4px}
  .s{border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink-2);border-radius:3px;min-width:40px;padding:5px 8px;font:600 12px/1 Inter,sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
  .s small{display:block;font-weight:500;color:var(--mute);font-size:10px;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .s.pull{border-bottom:3px solid var(--ink)} .s.push{border-bottom:3px solid var(--accent)}
  .s.cls{border-style:dashed;color:var(--mute)}
  .s.on{background:var(--ink);color:#fff;border-color:var(--ink)} .s.on small{color:#cfc9c1}
  .s:focus-visible,.tog:focus-visible,.exrow:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:none;border:none;cursor:pointer;padding:0}
  .tog .sw{width:28px;height:15px;border-radius:999px;background:var(--rule-2);position:relative}
  .tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff}
  .tog.on .sw{background:var(--accent)} .tog.on .sw::after{left:15px}
  .clock{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;cursor:pointer;color:var(--ink-2)}

  /* ---------- sheet ---------- */
  .sheet{max-width:1180px;margin:22px auto 60px;background:var(--sheet);border:1px solid var(--rule);padding:34px 40px 40px}
  @media (max-width:760px){.sheet{margin:0;padding:22px 18px;border:none}}
  .head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
  @media (max-width:760px){.head{grid-template-columns:1fr}}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(44px,6vw,76px);line-height:.95;margin:6px 0 10px;text-transform:uppercase;letter-spacing:.005em}
  h1 .type{color:var(--accent)}
  .idea{font-size:17px;color:var(--ink-2);max-width:60ch}
  .idea b{color:var(--ink);font-weight:600}
  .facts{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:13px;color:var(--mute);text-align:right}
  .facts b{color:var(--ink);font-weight:600;font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1}
  .facts div{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .facts span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  .scroll{overflow-x:auto}
  th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:14px 10px 8px;border-bottom:1px solid var(--rule)}
  td{padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:baseline}
  tr.block td{padding:26px 10px 8px;border-bottom:2px solid var(--ink);vertical-align:baseline}
  tr.block .bn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
  tr.block .bn small{font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;color:var(--mute);margin-left:12px;text-transform:uppercase}
  tr.block .exos{font-size:12px;color:var(--mute);text-align:right;display:none;font-style:italic}
  .exos-on tr.block .exos{display:table-cell}
  tr.sub td{padding:14px 10px 4px;border-bottom:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .c-lbl{width:120px;color:var(--mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;white-space:nowrap}
  .c-ex{font-size:clamp(17px,1.8vw,21px);font-weight:500}
  .c-ex .new{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mark);font-weight:700;margin-left:10px;vertical-align:middle}
  .c-ex .pat{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:10px;font-weight:600}
  .c-rx{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(20px,2vw,27px);font-variant-numeric:tabular-nums;white-space:nowrap;width:190px}
  .c-rx.film{font-family:Inter,sans-serif;font-weight:500;font-size:14px;color:var(--accent);white-space:normal}
  .c-cue{color:var(--ink-2);font-size:14.5px;max-width:44ch}
  .exrow{cursor:pointer}
  .exrow:hover td{background:var(--accent-soft)}
  .exrow[tabindex]:focus td{background:var(--accent-soft)}
  .foot{margin-top:26px;display:flex;justify-content:space-between;gap:18px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
  .foot b{color:var(--ink-2);font-weight:600}

  /* ---------- classroom sheet ---------- */
  .cls-body{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;margin-top:22px}
  @media (max-width:760px){.cls-body{grid-template-columns:1fr}}
  .cls-body h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;margin:0 0 8px;letter-spacing:.02em;border-bottom:2px solid var(--ink);padding-bottom:6px}
  .cls-body ol,.cls-body ul{margin:0;padding-left:0;list-style:none}
  .cls-body li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
  .cls-body li em{display:block;font-style:normal;color:var(--mute);font-size:13px;margin-top:2px}
  .cls-body ol{counter-reset:n} .cls-body ol li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:8px}
  .cls-body ol li::before{content:counter(n,decimal-leading-zero);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:var(--accent);line-height:1.1}

  /* ---------- teaching card ---------- */
  .overlay{position:fixed;inset:0;background:rgba(251,250,247,.94);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .overlay.open{display:flex}
  .card{background:var(--sheet);border:1px solid var(--rule);max-width:1040px;width:100%;padding:38px 44px;display:grid;grid-template-columns:1.05fr 1fr;gap:44px;box-shadow:0 30px 60px rgba(24,22,26,.08)}
  @media (max-width:820px){.card{grid-template-columns:1fr;padding:26px 22px}}
  .card .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .card h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(40px,5vw,66px);line-height:.95;margin:8px 0 14px;text-transform:uppercase}
  .card .rxbig{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
  .card .rxbig span{font-family:Inter,sans-serif;font-weight:500;font-size:14px;color:var(--mute);margin-left:10px}
  .card .cue{font-size:19px;color:var(--ink-2);margin-top:18px;max-width:38ch;border-left:3px solid var(--accent);padding-left:14px}
  .card .cue b{color:var(--ink);font-weight:600}
  .card h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 10px}
  .crit{margin:0;padding:0;list-style:none;counter-reset:c}
  .crit li{counter-increment:c;display:grid;grid-template-columns:36px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:17px;align-items:baseline}
  .crit li::before{content:counter(c,decimal-leading-zero);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:var(--accent)}
  .crit li em{display:block;font-style:normal;font-size:13px;color:var(--mute)}
  .ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:22px;position:relative}
  .ladder::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:2px;background:var(--rule-2)}
  .ladder div{text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:34px;line-height:1.25}
  .ladder div::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--rule-2);background:var(--sheet);font:700 13px/24px 'Barlow Condensed',sans-serif;color:var(--mute)}
  .ladder div.here{color:var(--ink);font-weight:600} .ladder div.here::before{border-color:var(--accent);background:var(--accent);color:#fff}
  .ladder div.done::before{border-color:var(--ink);color:var(--ink)}
  .back{position:fixed;top:16px;right:20px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:3px;padding:8px 14px;font:600 12px Inter,sans-serif;color:var(--ink-2);cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
  .plain{font-size:17px;color:var(--ink-2);max-width:40ch}
  @media print{.strip,.back{display:none}.sheet{border:none;margin:0}}
</style>

<div class="strip">
  <div class="wordmark">Athlete <span>Academy</span></div>
  <div class="unit">Intro to Training · G9</div>
  <div class="timeline" id="timeline"></div>
  <button class="tog" id="exosTog" type="button" aria-pressed="false"><span class="sw"></span>Show structure names</button>
  <div class="clock" id="clock" title="Click or press space">00:00</div>
</div>

<div class="sheet" id="sheet"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <button class="back" id="back" type="button">Back to session · Esc</button>
  <div class="card" id="card"></div>
</div>

<script>
// =====================================================================
// PATTERN CONTENT (criteria and level ladders from the current portal)
// =====================================================================
const PATTERNS = {
  Squat:{ ladder:['Bodyweight squat','Goblet squat','Back squat','Front squat','Pistol / squat clean'],
    criteria:[['Feet flat throughout','No heel rise at any point'],['Knees track over the toes','No inward collapse'],['Hip crease below the knee','At the bottom'],['Neutral spine','No rounding or arching'],['Controlled descent','Two seconds down'],['No excessive forward lean','Torso within 45 degrees']]},
  Hinge:{ ladder:['Bodyweight hinge','Kettlebell deadlift','Hex-bar deadlift','Barbell deadlift','Single-leg RDL / power clean'],
    criteria:[['Spine neutral throughout','No rounding of the lower back'],['Hips go back first','Not a squat'],['Knees soft, not bent far','About 15 to 20 degrees'],['Weight in mid-foot and heels','Not the toes'],['Shoulders over the bar','At the start'],['Full hip extension at the top','Squeeze the glutes, stand tall']]},
  Push:{ ladder:['Floor push-up','Dumbbell bench press','Barbell bench press','Single-arm DB press','Plyo push-up'],
    criteria:[['Full range of motion','Chest to the floor, full lockout'],['Elbows at 45 degrees','Not flared to 90'],['Shoulder blades pulled back','Throughout'],['Core on, no sagging','Body in one straight line'],['Controlled descent','No bouncing'],['Feet stable','No leg drive']]},
  Pull:{ ladder:['Banded row','Horizontal bar pull','Dumbbell row','Pull-up','Weighted pull-up / clean pull'],
    criteria:[['Full range of motion','Arms long to fully pulled'],['Shoulder blade squeezes','At the top'],['No body swing','Controlled'],['Elbow drives back','Not just the arm'],['Chest up, shoulders down','No shrug'],['Core on throughout','Stable torso']]},
  Lunge:{ ladder:['Bodyweight lunge','Dumbbell lunge','Barbell lunge','Rear-foot-elevated split squat','Lateral lunge / split jerk'],
    criteria:[['Front knee tracks over the toes','No inward collapse'],['Back knee near the floor','Full depth, controlled'],['Torso upright','No forward lean'],['Both knees about 90 degrees','At the bottom'],['Front heel stays down','Weight through the whole foot'],['Controlled throughout','No wobble']]},
  Press:{ ladder:['Band overhead press','Dumbbell press','Barbell press','Push press','Single-arm press / jerk'],
    criteria:[['Full lockout overhead','Arms straight'],['Bar path straight','Head back, not bar forward'],['Core braced','No back arch'],['Elbows in front of the bar','At the start'],['Controlled descent','Back to the shoulders'],['Feet planted','No stepping']]}
};

// =====================================================================
// THE UNIT. Same three blocks every session: Prep, Move, Finish.
// Move splits into Learn + Practise in Block 1, Primary + Accessory from Block 2.
// Push and Pull alternate. Two patterns learned per session. Load only in Block 3,
// and only for stamped patterns. Jump-and-land and the finisher arrive unnamed.
// =====================================================================
const EXOS = { prep:'Pillar prep · Movement prep · Plyometrics', move:'Strength and power', finish:'Energy systems · Regeneration' };
const FILM = 'Technique · watch side on';

const UNIT = [
 { block:1, title:'Learn the shape', sessions:[
  { n:1, type:'Pull', day:'Gym 1', idea:'<b>Hips back, then pull.</b> Hinge and pull are the two ways the back of the body works. Today is about the shape of a session and the shape of these two movements.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side','Slow, reach tall on the twist'], ['Move','Inchworm','5','Walk the hands out, hold, walk back'] ],
    sub1:'Learn', learn:[ ['Hinge',1,'Bodyweight hinge',FILM,'Push the <b>hips back</b> first, hands slide down the thighs. Flat back the whole way.',true], ['Pull',2,'Horizontal bar pull',FILM,'Bar at hip height. <b>Squeeze the shoulder blades</b> at the top, chest up, no shrug.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight hinge','2 × 10','Slow. Feel the hamstrings load'], ['Upper','Horizontal bar pull','2 × 8','Straight body, feet closer if it is too hard'], ['Trunk','Glute bridge','2 × 10','Squeeze at the top for two seconds'] ],
    finish:[ ['Cool down','Walk it out, then hamstring stretch','3 min','Breathe slowly through the nose'], ['Check-out','Which felt harder, hinge or pull?','1 min','Tell a partner why'] ] },
  { n:2, type:'Push', day:'Gym 2', idea:'<b>Knees, then push.</b> Squat and push-up are the two ways the front of the body works. Same session shape as last time, different movements.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Bear crawl','20 m out and back','Knees an inch off the floor, hips low'] ],
    sub1:'Learn', learn:[ ['Squat',1,'Bodyweight squat',FILM,'<b>Feet flat</b>, knees over the toes, hips below the knee. Two seconds down.',true], ['Push',1,'Floor push-up',FILM,'Elbows at <b>45 degrees</b>. Body in one line from head to heel. Hands on a box if needed.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight squat','2 × 10','Pause for one second at the bottom'], ['Upper','Push-up, floor or box','2 × 8','Choose the height where you can do eight clean'], ['Trunk','Dead bug','2 × 8 each side','Lower back stays pressed into the floor'] ],
    finish:[ ['Cool down','Walk it out, then quad and chest stretch','3 min',''], ['Check-out','Which push-up height did you choose and why?','1 min',''] ] },
  { n:3, type:'Pull', day:'Gym 3', idea:'<b>Do it again, and check it.</b> Same two movements as Gym 1. Today you partner-check each other against the criteria, and the first stamps go in.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Inchworm to a push-up','5',''], ['Land','Snap down and stick','2 × 5','Land quiet, knees soft, hold for two seconds'] ],
    sub1:'Learn', learn:[ ['Hinge',1,'Bodyweight hinge, partner check','Criteria card','Partner watches side on. Tick the six criteria. Swap.',false], ['Pull',2,'Horizontal bar pull, partner check','Criteria card','Partner watches front on. Tick the six. Swap.',false] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight hinge, dowel on the back','2 × 10','Dowel touches head, upper back and tailbone the whole time'], ['Upper','Horizontal bar pull','2 × 8','One second squeeze at the top'], ['Trunk','Single-leg glute bridge','2 × 8 each side','Hips level, no twist'] ],
    finish:[ ['Cool down','Walk it out, hamstring and hip stretch','3 min',''], ['Check-out','Which criterion did your partner tick last?','1 min','That is the one to work on'] ] },
  { n:4, type:'Push', day:'Gym 4', idea:'<b>One leg, and overhead.</b> Two new movements: the lunge is the single-leg squat, the press is the push-up turned upright. All six patterns are now in.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Bear crawl','20 m out and back',''], ['Land','Snap down and stick','2 × 5','Quiet feet'] ],
    sub1:'Learn', learn:[ ['Lunge',1,'Bodyweight lunge',FILM,'Step long. <b>Front heel down</b>, back knee near the floor, torso tall.',true], ['Press',1,'Band overhead press',FILM,'Ribs down, <b>lock out</b> overhead. Head moves back, the band goes straight up.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight squat, then lunge','2 × 8 + 6 each side','Squat set, then lunge set, then rest'], ['Upper','Push-up, floor or box','2 × 8',''], ['Trunk','Front plank','2 × 30 s','Squeeze the glutes, long neck'] ],
    finish:[ ['Cool down','Walk it out, hip flexor and shoulder stretch','3 min',''], ['Check-out','Which of the six patterns feels least controlled?','1 min','You will answer this again in the classroom'] ] },
  { n:'A', type:'Classroom', day:'Classroom A', idea:'<b>Consolidate.</b> Meet the portal and the passport. Watch the six videos. Self-check against the criteria. Say which pattern feels least controlled.',
    cls:{ do:[ ['Sign in and open the passport','What a stamp means, and that stamps arrive whenever you are ready'], ['Watch the six pattern videos','One minute each, pause on the criteria'], ['Self-check each pattern','Tick the criteria you are sure of, leave the rest blank'], ['Reflection','Which pattern feels least controlled, and which criterion is the reason?'] ],
          ticks:[ 'Gym rules and re-racking', 'Partner-checked a movement', 'Can name the three parts of a session' ] } }
 ]},
 { block:2, title:'All six, one idea at a time', sessions:[
  { n:5, type:'Pull', day:'Gym 5', idea:'<b>Horizontal and vertical.</b> The bar pull and the band pull-down are the same squeeze in two directions. Tempo is the cue of this block: three seconds down, one up.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Inchworm to a push-up','5',''], ['Land','Hop and stick, forward','2 × 5 each leg','Land on one foot, quiet, hold two seconds'], ['Prehab','Shoulder taps in a plank','2 × 10','Hips still'] ],
    sub1:'Primary', learn:[ ['Hinge',1,'Bodyweight hinge, or kettlebell hinge if stamped','3 × 8 · tempo 3-1-1','Three seconds down. The bell is only for stamped hinges.',false], ['Pull',2,'Horizontal bar pull','3 × 8 · tempo 3-1-1','Feet further forward is harder. Choose the angle where eight is hard but clean.',false] ],
    sub2:'Accessory', work:[ ['Vertical pull','Band pull-down','2 × 10','Elbows to the ribs, no shrug'], ['Lower','Single-leg glute bridge','2 × 8 each side',''], ['Trunk','Side plank','2 × 20 s each side','Hips high'] ],
    finish:[ ['Finisher','Bike or shuttles','4 × 30 s on, 30 s off','Hard on, easy off'], ['Cool down','Hamstring and lat stretch','2 min',''] ] },
  { n:6, type:'Push', day:'Gym 6', idea:'<b>One leg and two legs.</b> The lunge is the honest version of the squat: it shows which side is weaker. Tempo again: three down, one up.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Bear crawl','20 m out and back',''], ['Land','Hop and stick, sideways','2 × 5 each leg','Push sideways, land quiet'], ['Prehab','Groin squeeze on a ball','2 × 10','Five-second squeeze'] ],
    sub1:'Primary', learn:[ ['Squat',1,'Bodyweight squat, or goblet squat if stamped','3 × 8 · tempo 3-1-1','Goblet only for stamped squats. Light bell, elbows inside the knees.',false], ['Push',1,'Push-up, floor or box','3 × 8 · tempo 3-1-1','Same height as last time or one lower.',false] ],
    sub2:'Accessory', work:[ ['Single leg','Bodyweight lunge','2 × 6 each side','Note which side wobbles'], ['Overhead','Band overhead press','2 × 10','Ribs down, full lockout'], ['Trunk','Dead bug','2 × 8 each side',''] ],
    finish:[ ['Finisher','Bike or shuttles','4 × 30 s on, 30 s off',''], ['Cool down','Quad, hip flexor and chest stretch','2 min',''] ] },
  { n:7, type:'Pull', day:'Gym 7', idea:'<b>Upper and lower.</b> Hinge is the biggest lower-body pull, the row is the upper one. Both need a flat back. Partner-check again: second round of stamps.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Inchworm to a push-up','5',''], ['Land','Hop and stick, forward','2 × 5 each leg',''], ['Prehab','Shoulder taps in a plank','2 × 10',''] ],
    sub1:'Primary', learn:[ ['Hinge',1,'Hinge, partner check, then kettlebell hinge if stamped','3 × 8','Partner ticks the six first. Bell only if all six are ticked.',false], ['Pull',2,'Horizontal bar pull, partner check','3 × 8','Partner ticks the six. Then do your sets.',false] ],
    sub2:'Accessory', work:[ ['Vertical pull','Band pull-down','2 × 10',''], ['Lower','Single-leg hinge, hand on the wall','2 × 6 each side','Back leg long, hips square'], ['Throw','Med-ball slam','2 × 6','As hard as you can. Reset every rep'] ],
    finish:[ ['Finisher','Bike or shuttles','4 × 30 s on, 30 s off',''], ['Cool down','Hamstring and lat stretch','2 min',''] ] },
  { n:'B', type:'Classroom', day:'Classroom B', idea:'<b>Reading a prescription.</b> What 3 × 8 at tempo 3-1-1 means. How to choose a weight. What a 7 out of 10 feels like. Then a second self-check against all six.',
    cls:{ do:[ ['Reading a prescription','Sets, reps, tempo, rest. Read three lines from the Board out loud and explain each'], ['Choosing a weight','The last two reps are hard, every rep is clean. If either fails, go lighter'], ['Effort out of 10','What a 7 feels like, what a 9 feels like. Why we train at 7 first'], ['Self-check all six','Compare to Classroom A. What changed?'], ['Reflection','Which patterns are you ready to be stamped on? What is the evidence?'] ],
          ticks:[ 'Held a tempo', 'Can read a prescription', 'Can explain a 7 out of 10' ] } }
 ]},
 { block:3, title:'Load it, then run it', sessions:[
  { n:8, type:'Pull', day:'Gym 8', idea:'<b>First real load.</b> Stamped patterns pick up a weight today. The rule: last two reps hard, every rep clean. Unstamped patterns keep practising at bodyweight, no penalty.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Inchworm to a push-up','5',''], ['Land','Hop and stick, forward','2 × 5 each leg',''], ['Prehab','Shoulder taps in a plank','2 × 10',''] ],
    sub1:'Primary', learn:[ ['Hinge',2,'Kettlebell deadlift if stamped, else bodyweight hinge','3 × 8 · 7 of 10','Start light. Add a bell only if all eight were clean.',false], ['Pull',2,'Horizontal bar pull','3 × 8 · 7 of 10','Lower the bar one notch if eight were easy.',false] ],
    sub2:'Accessory', work:[ ['Vertical pull','Assisted pull-up or band pull-down','3 × 5','Band or box for help. Chin over the bar'], ['Lower','Nordic lower','3 × 3','Lower slowly, hands ready to catch'], ['Trunk','Hanging knee raise','2 × 8','No swing'] ],
    finish:[ ['Finisher','Bike or shuttles','5 × 30 s on, 30 s off',''], ['Cool down','Hamstring and lat stretch','2 min',''], ['Check-out','What weight did you use, and was it right?','1 min','You will log this in the classroom'] ] },
  { n:9, type:'Push', day:'Gym 9', idea:'<b>Choose your own weight.</b> Same rule as last time. Squat, lunge and press pick up load if stamped. Aim for a 7 out of 10 and be honest.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Bear crawl','20 m out and back',''], ['Land','Hop and stick, sideways','2 × 5 each leg',''], ['Prehab','Groin squeeze on a ball','2 × 10',''] ],
    sub1:'Primary', learn:[ ['Squat',2,'Goblet squat if stamped, else bodyweight squat','3 × 8 · 7 of 10','Pick the bell where the last two reps are hard.',false], ['Push',1,'Push-up, or dumbbell floor press if stamped','3 × 8 · 7 of 10','Floor press: elbows at 45, pause on the floor.',false] ],
    sub2:'Accessory', work:[ ['Single leg','Lunge, dumbbells if stamped','3 × 6 each side',''], ['Overhead','Dumbbell press if stamped, else band','3 × 8','Full lockout, ribs down'], ['Throw','Med-ball rotational throw','2 × 6 each side','Hips first, then the ball'] ],
    finish:[ ['Finisher','Bike or shuttles','5 × 30 s on, 30 s off',''], ['Cool down','Quad, hip flexor and chest stretch','2 min',''], ['Check-out','Rate the session out of 10','1 min','Remember the number'] ] },
  { n:10, type:'Pull', day:'Gym 10', idea:'<b>Run it yourself.</b> The Board is up, nobody is cueing. Warm up, choose your weights, keep the tempo, rate your effort. Unit complete.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Move','World\'s Greatest Stretch','5 each side',''], ['Move','Inchworm to a push-up','5',''], ['Land','Hop and stick, your choice','2 × 5 each leg',''], ['Prehab','Shoulder taps in a plank','2 × 10',''] ],
    sub1:'Primary', learn:[ ['Hinge',2,'Kettlebell deadlift if stamped, else bodyweight hinge','3 × 8 · 7 of 10','Your weight from Gym 8, or a little more if it was easy.',false], ['Pull',2,'Horizontal bar pull','3 × 8 · 7 of 10','',false] ],
    sub2:'Accessory', work:[ ['Vertical pull','Assisted pull-up or band pull-down','3 × 5',''], ['Lower','Nordic lower','3 × 3',''], ['Trunk','Hanging knee raise','2 × 8',''] ],
    finish:[ ['Finisher','Bike or shuttles','5 × 30 s on, 30 s off',''], ['Cool down','Your choice','2 min',''], ['Check-out','Rate the session out of 10','1 min','Log it in Classroom C'] ] },
  { n:'C', type:'Classroom', day:'Classroom C', idea:'<b>Log it, and look ahead.</b> Enter the last gym session in the portal, with your weights and your rating. Then a preview of Foundations, where the session shape gets its full names.',
    cls:{ do:[ ['Log Gym 10','Every exercise, sets, reps, weight or height, and the effort out of 10'], ['Final self-check','All six patterns. Compare to A and B'], ['Preview Foundations','The full session map with its names, and what "this week" will look like'], ['Reflection','Which pattern moved the most this unit? What is the next stamp you want?'] ],
          ticks:[ 'Logged a session', 'Rated a session', 'Ran a session without cues' ] } }
 ]}
];

const FLAT = []; UNIT.forEach(b => b.sessions.forEach(s => FLAT.push(Object.assign({block:b.block, blockTitle:b.title}, s))));
let cur = 0, exos = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/</g,'&lt;');

function renderTimeline(){
  $('timeline').innerHTML = UNIT.map(b => `<div class="blk"><div class="bl">Block ${b.block} · ${b.title}</div><div class="ss">${
    b.sessions.map(s => { const i = FLAT.findIndex(f => f.day===s.day);
      const cls = s.type==='Classroom' ? 'cls' : s.type.toLowerCase();
      return `<button type="button" class="s ${cls} ${i===cur?'on':''}" data-i="${i}">${s.n}<small>${s.type==='Classroom'?'Class':s.type}</small></button>`; }).join('')
  }</div></div>`).join('');
}

function row(kind, lbl, ex, rx, cue, pat, level, isNew, isFilm){
  const rxCls = isFilm ? 'c-rx film' : 'c-rx';
  return `<tr class="exrow" tabindex="0" data-kind="${kind}" data-ex="${esc(ex)}" data-rx="${esc(rx)}" data-cue="${esc(cue||'')}" data-pat="${pat||''}" data-level="${level||''}">
    <td class="c-lbl">${lbl}</td>
    <td class="c-ex">${ex}${isNew?`<span class="new">New</span>`:''}</td>
    <td class="${rxCls}">${rx}</td>
    <td class="c-cue">${cue||''}</td></tr>`;
}
function blockRow(name, mins, exosText){ return `<tr class="block"><td colspan="3"><span class="bn">${name}<small>${mins}</small></span></td><td class="exos">${exosText}</td></tr>`; }
function subRow(name){ return `<tr class="sub"><td colspan="4">${name}</td></tr>`; }

function render(){
  const s = FLAT[cur];
  renderTimeline();
  document.body.classList.toggle('exos-on', exos); $('exosTog').classList.toggle('on', exos); $('exosTog').setAttribute('aria-pressed', String(exos));
  const head = `<div class="head"><div>
      <div class="kicker">Block ${s.block} · ${s.blockTitle}</div>
      <h1>${s.type==='Classroom' ? 'Classroom '+s.n : 'Session '+s.n+' <span class="type">'+s.type+'</span>'}</h1>
      <div class="idea">${s.idea}</div></div>
    <div class="facts">${s.type==='Classroom'
      ? `<div><b>45</b><span>minutes</span></div><div><b>Portal</b><span>on laptops</span></div>`
      : `<div><b>40</b><span>minutes</span></div><div><b>${s.type}</b><span>session</span></div>`}</div></div>`;
  if(s.type==='Classroom'){
    $('sheet').innerHTML = head + `<div class="cls-body"><div><h3>What we do</h3><ol>${s.cls.do.map(d=>`<li><span>${d[0]}<em>${d[1]}</em></span></li>`).join('')}</ol></div>
      <div><h3>Ticks this session</h3><ul>${s.cls.ticks.map(t=>`<li>${t}</li>`).join('')}</ul>
      <p class="plain" style="margin-top:22px">Stamps are given in the gym, from the roster on the teacher's phone. The classroom is where you see them, check yourself against the criteria and say what is next.</p></div></div>`;
    return;
  }
  const prepMin = s.block===1 ? '10 min' : '12 min';
  let t = `<div class="scroll"><table>
    <thead><tr><th>Block</th><th>Exercise</th><th>Sets and reps</th><th>Cue</th></tr></thead><tbody>`;
  t += blockRow('Prep', prepMin, EXOS.prep);
  s.prep.forEach(p => { t += row('prep', p[0], p[1], p[2], p[3]); });
  t += blockRow('Move', '25 min', EXOS.move);
  t += subRow(s.sub1);
  s.learn.forEach(l => { t += row('learn', l[0], l[2], l[3], l[4], l[0], l[1], l[5], l[3]===FILM); });
  t += subRow(s.sub2);
  s.work.forEach(w => { t += row('work', w[0], w[1], w[2], w[3]); });
  t += blockRow('Finish', '5 min', EXOS.finish);
  s.finish.forEach(f => { t += row('finish', f[0], f[1], f[2], f[3]); });
  t += `</tbody></table></div>
    <div class="foot"><div><b>Stamps:</b> given in any session, from the roster. A stamped pattern may use the loaded option where the Board offers one.</div><div><b>Tap any line</b> to put it on screen for teaching.</div></div>`;
  $('sheet').innerHTML = head + t;
}

function openRow(tr){
  const d = tr.dataset, p = d.pat ? PATTERNS[d.pat] : null, lvl = parseInt(d.level)||0;
  const left = `<div><div class="k">${d.kind==='learn'?'Learn':d.kind==='work'?'Practise':d.kind==='prep'?'Prep':'Finish'}${d.pat?' · '+d.pat+' pattern':''}</div>
    <h2>${d.ex}</h2><div class="rxbig">${d.rx}</div>${d.cue?`<div class="cue">${d.cue}</div>`:''}</div>`;
  const right = p ? `<div><h3>What good looks like</h3><ul class="crit">${p.criteria.map(c=>`<li><span>${c[0]}<em>${c[1]}</em></span></li>`).join('')}</ul>
      <h3 style="margin-top:22px">The ladder</h3><div class="ladder">${p.ladder.map((n,i)=>`<div data-n="${i+1}" class="${i+1===lvl?'here':(i+1<lvl?'done':'')}">${n}</div>`).join('')}</div></div>`
    : `<div><h3>Coaching note</h3><p class="plain">${d.cue || 'Keep it simple. Quality first, then speed.'}</p></div>`;
  $('card').innerHTML = left + right;
  $('overlay').classList.add('open'); $('back').focus();
}
function closeRow(){ $('overlay').classList.remove('open'); }

$('timeline').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; cur = +b.dataset.i; render(); });
$('sheet').addEventListener('click', e => { const tr = e.target.closest('tr.exrow'); if(tr) openRow(tr); });
$('sheet').addEventListener('keydown', e => { if(e.key==='Enter'){ const tr = e.target.closest('tr.exrow'); if(tr) openRow(tr); } });
$('back').addEventListener('click', closeRow);
$('overlay').addEventListener('click', e => { if(e.target===$('overlay')) closeRow(); });
$('exosTog').addEventListener('click', () => { exos = !exos; render(); });

let t0=null, acc=0, tick=null;
const fmt = ms => String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
function toggleClock(){ if(tick){ acc += Date.now()-t0; clearInterval(tick); tick=null; } else { t0=Date.now(); tick=setInterval(()=>{ $('clock').textContent = fmt(acc+Date.now()-t0); },500); } }
$('clock').addEventListener('click', toggleClock);
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeRow();
  if(e.key===' ' && !e.target.closest('button,tr')) { e.preventDefault(); toggleClock(); }
  const open = $('overlay').classList.contains('open');
  if(e.key==='ArrowRight' && !open){ cur=(cur+1)%FLAT.length; render(); }
  if(e.key==='ArrowLeft'  && !open){ cur=(cur+FLAT.length-1)%FLAT.length; render(); }
});
render();
</script>
