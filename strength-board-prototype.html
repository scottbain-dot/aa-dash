<title>Intro to Training Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f7f5f1; --sheet:#ffffff; --ink:#18161a; --ink-2:#4b4750; --mute:#8a8590; --rule:#e4e0da; --rule-2:#c9c3bb;
    --accent:#874B46; --accent-soft:#f4ebe9; --mark:#b8922a;
    /* type scale follows the screen width so the wall copy reads from the rack */
    --ex: clamp(17px, 1.4vw, 31px);
    --rx: clamp(19px, 1.55vw, 35px);
    --cue: clamp(13px, 1.02vw, 22px);
    --eyebrow: clamp(10px, .62vw, 14px);
  }
  *{box-sizing:border-box}
  html,body{background:var(--paper);height:100%}
  body{margin:0;color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif;line-height:1.3;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  button{font-family:inherit}

  /* ---------- teacher strip (hidden in present mode) ---------- */
  .strip{display:flex;align-items:center;gap:22px;padding:12px 26px;border-bottom:1px solid var(--rule);background:var(--sheet);flex-wrap:wrap;flex:none}
  .present .strip{display:none}
  .wordmark{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
  .wordmark span{color:var(--accent)}
  .unit{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .timeline{display:flex;align-items:flex-end;gap:4px;flex:1;min-width:300px;overflow-x:auto;padding:4px 2px}
  .blk{display:flex;flex-direction:column;gap:5px;padding-right:12px;margin-right:8px;border-right:1px solid var(--rule)}
  .blk:last-child{border-right:none}
  .blk .bl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
  .blk .ss{display:flex;gap:4px}
  .s{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink-2);border-radius:3px;min-width:40px;padding:5px 8px;font:600 12px/1 Inter,sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
  .s small{display:block;font-weight:500;color:var(--mute);font-size:10px;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .s.pull{border-bottom:3px solid var(--ink)} .s.push{border-bottom:3px solid var(--accent)}
  .s.cls{border-style:dashed;color:var(--mute)}
  .s.rules{border-bottom:3px solid var(--mark);margin-right:-10px}
  .rules-view{grid-template-columns:1fr 1fr 1fr}
  .rules-view .rule .ex{font-weight:600}
  .rules-view .box .bh .n{white-space:nowrap}
  .s.on{background:var(--ink);color:#fff;border-color:var(--ink)} .s.on small{color:#cfc9c1}
  .s:focus-visible,.tog:focus-visible,.row:focus-visible,.back:focus-visible,.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:none;border:none;cursor:pointer;padding:0}
  .tog .sw{width:28px;height:15px;border-radius:999px;background:var(--rule-2);position:relative}
  .tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff}
  .tog.on .sw{background:var(--accent)} .tog.on .sw::after{left:15px}
  .pbtn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;padding:7px 12px;font:600 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .clock{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;cursor:pointer;color:var(--ink-2)}

  /* ---------- session ---------- */
  .stage{flex:1;display:flex;flex-direction:column;padding:clamp(14px,1.6vw,30px) clamp(16px,2vw,40px) clamp(12px,1.4vw,26px);gap:clamp(10px,1.2vw,22px);min-height:0}
  .head{display:flex;align-items:baseline;gap:clamp(14px,2vw,40px);flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:clamp(8px,.8vw,14px)}
  .head h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(36px,3.8vw,76px);line-height:.92;margin:0;text-transform:uppercase;white-space:nowrap}
  .head h1 .type{color:var(--accent)}
  .head .kicker{font-size:var(--eyebrow);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap}
  .head .idea{font-size:clamp(15px,1.25vw,27px);color:var(--ink-2);flex:1;min-width:260px;max-width:70ch}
  .head .idea b{color:var(--ink);font-weight:600}
  .head .clk{display:none;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(22px,2vw,40px);font-variant-numeric:tabular-nums;color:var(--ink-2);margin-left:auto}
  .present .head .clk{display:block}

  .boxes{flex:1;display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:clamp(10px,1.2vw,22px);min-height:0}
  @media (max-width:900px){.boxes{grid-template-columns:1fr}}
  .box{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);display:flex;flex-direction:column;min-height:0}
  .box.move{border-top-color:var(--accent)}
  .box .bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:clamp(10px,1vw,18px) clamp(12px,1.2vw,22px) clamp(6px,.6vw,10px);border-bottom:1px solid var(--rule)}
  .box .bh .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(24px,2.3vw,46px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
  .box .bh .m{font-size:var(--eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
  .box .bh .exos{display:none;width:100%;font-size:var(--eyebrow);color:var(--mute);font-style:italic;letter-spacing:0;text-transform:none;font-weight:500}
  .exos-on .box .bh{flex-wrap:wrap}
  .exos-on .box .bh .exos{display:block}
  .box .rows{flex:1;overflow:auto;padding:0 clamp(12px,1.2vw,22px)}
  .row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rule);padding:clamp(6px,.65vw,13px) 0;cursor:pointer;color:inherit}
  .row:last-child{border-bottom:none}
  .row:hover,.row:focus{background:var(--accent-soft);margin:0 calc(-1 * clamp(12px,1.2vw,22px));padding-left:clamp(12px,1.2vw,22px);padding-right:clamp(12px,1.2vw,22px);width:auto}
  .row .eb{font-size:var(--eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:2px}
  .row .eb .new{color:var(--mark);margin-left:8px}
  .row .top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .row .ex{font-size:var(--ex);font-weight:500;line-height:1.15}
  .row .rx{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:var(--rx);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
  .row .rx.tech{font-family:Inter,sans-serif;font-weight:500;font-size:var(--cue);color:var(--accent);white-space:normal;text-align:right;max-width:40%}
  .row .cue{font-size:var(--cue);color:var(--ink-2);margin-top:2px;line-height:1.25}
  .row .cue b{color:var(--ink);font-weight:600}
  .sub{font-size:var(--eyebrow);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;padding:clamp(8px,.8vw,14px) 0 0}
  .sub:first-child{padding-top:clamp(6px,.6vw,10px)}
  .foot{display:flex;justify-content:space-between;gap:16px;font-size:clamp(11px,.75vw,15px);color:var(--mute);flex-wrap:wrap}
  .foot b{color:var(--ink-2);font-weight:600}
  .present .foot .hide{display:none}

  /* ---------- classroom ---------- */
  .cls{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(10px,1.2vw,22px);min-height:0}
  @media (max-width:900px){.cls{grid-template-columns:1fr}}
  .cls .box .rows{padding-top:6px}
  .cls ol,.cls ul{margin:0;padding:0;list-style:none}
  .cls li{padding:clamp(8px,.85vw,16px) 0;border-bottom:1px solid var(--rule);font-size:var(--ex);font-weight:500;line-height:1.2}
  .cls li em{display:block;font-style:normal;color:var(--ink-2);font-size:var(--cue);font-weight:400;margin-top:3px}
  .cls ol{counter-reset:n} .cls ol li{counter-increment:n;display:grid;grid-template-columns:clamp(30px,2.4vw,48px) 1fr;gap:8px}
  .cls ol li::before{content:counter(n,decimal-leading-zero);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:var(--rx);color:var(--accent);line-height:1.1}
  .plain{font-size:var(--cue);color:var(--ink-2);padding:clamp(8px,.85vw,16px) 0}

  /* ---------- teaching card ---------- */
  .overlay{position:fixed;inset:0;background:rgba(247,245,241,.96);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .overlay.open{display:flex}
  .card{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--accent);max-width:1400px;width:100%;padding:clamp(24px,2.6vw,50px);display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,3vw,60px);box-shadow:0 30px 60px rgba(24,22,26,.08)}
  @media (max-width:820px){.card{grid-template-columns:1fr}}
  .card .k{font-size:var(--eyebrow);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .card h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(40px,5vw,96px);line-height:.95;margin:8px 0 14px;text-transform:uppercase}
  .card .rxbig{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(26px,2.6vw,50px);font-variant-numeric:tabular-nums}
  .card .cuebig{font-size:clamp(18px,1.6vw,32px);color:var(--ink-2);margin-top:18px;max-width:34ch;border-left:3px solid var(--accent);padding-left:16px;line-height:1.3}
  .card .cuebig b{color:var(--ink);font-weight:600}
  .card h3{font-size:var(--eyebrow);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 10px}
  .crit{margin:0;padding:0;list-style:none;counter-reset:c}
  .crit li{counter-increment:c;display:grid;grid-template-columns:clamp(32px,2.4vw,48px) 1fr;gap:8px;padding:clamp(6px,.7vw,12px) 0;border-bottom:1px solid var(--rule);font-size:clamp(16px,1.45vw,29px);align-items:baseline;line-height:1.2}
  .crit li::before{content:counter(c,decimal-leading-zero);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(20px,1.8vw,36px);color:var(--accent)}
  .crit li em{display:block;font-style:normal;font-size:clamp(12px,1vw,20px);color:var(--mute)}
  .ladder{display:grid;grid-template-columns:repeat(5,1fr);margin-top:clamp(16px,1.6vw,30px);position:relative}
  .ladder::before{content:"";position:absolute;left:10%;right:10%;top:15px;height:2px;background:var(--rule-2)}
  .ladder div{text-align:center;font-size:clamp(11px,.85vw,17px);color:var(--mute);position:relative;padding-top:40px;line-height:1.2}
  .ladder div::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;border:2px solid var(--rule-2);background:var(--sheet);font:700 15px/28px 'Barlow Condensed',sans-serif;color:var(--mute)}
  .ladder div.here{color:var(--ink);font-weight:600} .ladder div.here::before{border-color:var(--accent);background:var(--accent);color:#fff}
  .ladder div.done::before{border-color:var(--ink);color:var(--ink)}
  .back{position:fixed;top:16px;right:20px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:3px;padding:8px 14px;font:600 12px Inter,sans-serif;color:var(--ink-2);cursor:pointer;letter-spacing:.06em;text-transform:uppercase;z-index:11}
  @media print{.strip,.back,.foot{display:none}.box{break-inside:avoid}}
</style>

<div class="strip">
  <div class="wordmark">Athlete <span>Academy</span></div>
  <div class="unit">Intro to Training · G9</div>
  <button class="s rules" id="rulesBtn" type="button">Rules<small>gym</small></button>
  <div class="timeline" id="timeline"></div>
  <button class="tog" id="exosTog" type="button" aria-pressed="false"><span class="sw"></span>Show structure names</button>
  <button class="pbtn" id="presentBtn" type="button" title="Full screen, hides this bar. Press F or Esc to leave.">Present</button>
  <div class="clock" id="clock" title="Click or press space">00:00</div>
</div>

<div class="stage" id="stage"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <button class="back" id="back" type="button">Back to session · Esc</button>
  <div class="card" id="card"></div>
</div>

<script>
const PATTERNS = {
  Squat:{ ladder:['Bodyweight squat','Goblet squat','Back squat','Front squat','Pistol / squat clean'],
    criteria:[['Feet flat throughout','No heel rise at any point'],['Knees track over the toes','No inward collapse'],['Hip crease below the knee','At the bottom'],['Neutral spine','No rounding or arching'],['Controlled descent','Two seconds down'],['No excessive forward lean','Torso within 45 degrees']]},
  Hinge:{ ladder:['Bodyweight hinge','Kettlebell deadlift','Hex-bar deadlift','Barbell deadlift','Single-leg RDL / power clean'],
    criteria:[['Spine neutral throughout','No rounding of the lower back'],['Hips go back first','Not a squat'],['Knees soft, not bent far','About 15 to 20 degrees'],['Weight in mid-foot and heels','Not the toes'],['Shoulders over the bar','At the start'],['Full hip extension at the top','Squeeze the glutes, stand tall']]},
  Push:{ ladder:['Floor push-up','Dumbbell bench press','Barbell bench press','Single-arm DB press','Plyo push-up'],
    criteria:[['Full range of motion','Chest to the floor, full lockout'],['Elbows at 45 degrees','Not flared to 90'],['Shoulder blades pulled back','Throughout'],['Core on, no sagging','Body in one straight line'],['Controlled descent','No bouncing'],['Feet stable','No leg drive']]},
  Pull:{ ladder:['Banded row','Horizontal bar pull','Dumbbell row','Pull-up','Weighted pull-up / clean pull'],
    criteria:[['Full range of motion','Arms long to fully pulled'],['Shoulder blade squeezes','At the top'],['No body swing','Controlled'],['Elbow drives back','Not just the arm'],['Chest up, shoulders down','No shrug'],['Core on throughout','Stable torso']]},
  Lunge:{ ladder:['Bodyweight lunge','Dumbbell lunge','Barbell lunge','Rear-foot-elevated split squat','Lateral lunge / split jerk'],
    criteria:[['Front knee tracks over the toes','No inward collapse'],['Back knee near the floor','Full depth, controlled'],['Torso upright','No forward lean'],['Both knees about 90 degrees','At the bottom'],['Front heel stays down','Weight through the whole foot'],['Controlled throughout','No wobble']]},
  Press:{ ladder:['Band overhead press','Dumbbell press','Barbell press','Push press','Single-arm press / jerk'],
    criteria:[['Full lockout overhead','Arms straight'],['Bar path straight','Head back, not bar forward'],['Core braced','No back arch'],['Elbows in front of the bar','At the start'],['Controlled descent','Back to the shoulders'],['Feet planted','No stepping']]}
};

// =====================================================================
// THE UNIT. Same three blocks every session: Prep, Move, Finish.
// Move splits into Learn + Practise in Block 1, Primary + Accessory from Block 2.
// Push and Pull alternate. Two patterns learned per session. Load only in Block 3,
// and only for stamped patterns. Jump-and-land and the finisher arrive unnamed.
// =====================================================================
const EXOS = { prep:'Pillar prep · Movement prep · Plyometrics', move:'Strength and power', finish:'Energy systems · Regeneration' };
const FILM = 'Technique · watch side on';

const UNIT = [
 { block:1, title:'Learn the shape', sessions:[
  { n:1, type:'Pull', day:'Gym 1', idea:'<b>Hips back, then pull.</b> Hinge and pull are the two ways the back of the body works. Today is about the shape of a session and the shape of these two movements.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Mobility','World\'s Greatest Stretch','5 each side','Slow, reach tall on the twist'], ['Crawl','Inchworm','5','Walk the hands out, hold, walk back'] ],
    sub1:'Learn', learn:[ ['Hinge',1,'Bodyweight hinge',FILM,'Push the <b>hips back</b> first, hands slide down the thighs. Flat back the whole way.',true], ['Pull',2,'Horizontal bar pull',FILM,'Bar at hip height. <b>Squeeze the shoulder blades</b> at the top, chest up, no shrug.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight hinge','2 × 10','Slow. Feel the hamstrings load'], ['Upper','Horizontal bar pull','2 × 8','Straight body, feet closer if it is too hard'], ['Trunk','Glute bridge','2 × 10','Squeeze at the top for two seconds'] ],
    finish:[ ['Cool down','Walk it out, then hamstring stretch','3 min','Breathe slowly through the nose'], ['Check-out','Which felt harder, hinge or pull?','1 min','Tell a partner why'] ] },
  { n:2, type:'Push', day:'Gym 2', idea:'<b>Knees, then push.</b> Squat and push-up are the two ways the front of the body works. Same session shape as last time, different movements.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Mobility','World\'s Greatest Stretch','5 each side',''], ['Crawl','Bear crawl','20 m out and back','Knees an inch off the floor, hips low'] ],
    sub1:'Learn', learn:[ ['Squat',1,'Bodyweight squat',FILM,'<b>Feet flat</b>, knees over the toes, hips below the knee. Two seconds down.',true], ['Push',1,'Floor push-up',FILM,'Elbows at <b>45 degrees</b>. Body in one line from head to heel. Hands on a box if needed.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight squat','2 × 10','Pause for one second at the bottom'], ['Upper','Push-up, floor or box','2 × 8','Choose the height where you can do eight clean'], ['Trunk','Dead bug','2 × 8 each side','Lower back stays pressed into the floor'] ],
    finish:[ ['Cool down','Walk it out, then quad and chest stretch','3 min',''], ['Check-out','Which push-up height did you choose and why?','1 min',''] ] },
  { n:3, type:'Pull', day:'Gym 3', idea:'<b>Do it again, and check it.</b> Same two movements as Gym 1. Today you partner-check each other against the criteria, and the first stamps go in.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Mobility','World\'s Greatest Stretch','5 each side',''], ['Crawl','Inchworm to a push-up','5',''], ['Land','Snap down and stick','2 × 5','Land quiet, knees soft, hold for two seconds'] ],
    sub1:'Learn', learn:[ ['Hinge',1,'Bodyweight hinge, partner check','Criteria card','Partner watches side on. Tick the six criteria. Swap.',false], ['Pull',2,'Horizontal bar pull, partner check','Criteria card','Partner watches front on. Tick the six. Swap.',false] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight hinge, dowel on the back','2 × 10','Dowel touches head, upper back and tailbone the whole time'], ['Upper','Horizontal bar pull','2 × 8','One second squeeze at the top'], ['Trunk','Single-leg glute bridge','2 × 8 each side','Hips level, no twist'] ],
    finish:[ ['Cool down','Walk it out, hamstring and hip stretch','3 min',''], ['Check-out','Which criterion did your partner tick last?','1 min','That is the one to work on'] ] },
  { n:4, type:'Push', day:'Gym 4', idea:'<b>One leg, and overhead.</b> Two new movements: the lunge is the single-leg squat, the press is the push-up turned upright. All six patterns are now in.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Mobility','World\'s Greatest Stretch','5 each side',''], ['Crawl','Bear crawl','20 m out and back',''], ['Land','Snap down and stick','2 × 5','Quiet feet'] ],
    sub1:'Learn', learn:[ ['Lunge',1,'Bodyweight lunge',FILM,'Step long. <b>Front heel down</b>, back knee near the floor, torso tall.',true], ['Press',1,'Band overhead press',FILM,'Ribs down, <b>lock out</b> overhead. Head moves back, the band goes straight up.',true] ],
    sub2:'Practise', work:[ ['Lower','Bodyweight squat, then lunge','2 × 8 + 6 each side','Squat set, then lunge set, then rest'], ['Upper','Push-up, floor or box','2 × 8',''], ['Trunk','Front plank','2 × 30 s','Squeeze the glutes, long neck'] ],
    finish:[ ['Cool down','Walk it out, hip flexor and shoulder stretch','3 min',''], ['Check-out','Which of the six patterns feels least controlled?','1 min','You will answer this again in the classroom'] ] },
  { n:'A', type:'Classroom', day:'Classroom A', idea:'<b>Consolidate.</b> Meet the portal and the passport. Watch the six videos. Self-check against the criteria. Say which pattern feels least controlled.',
    cls:{ do:[ ['Sign in and open the passport','What a stamp means, and that stamps arrive whenever you are ready'], ['Watch the six pattern videos','One minute each, pause on the criteria'], ['Self-check each pattern','Tick the criteria you are sure of, leave the rest blank'], ['Reflection','Which pattern feels least controlled, and which criterion is the reason?'] ],
          ticks:[ 'Gym rules and re-racking', 'Partner-checked a movement', 'Can name the three parts of a session' ] } }
 ]},
 { block:2, title:'All six, one idea at a time', sessions:[
  { n:5, type:'Pull', day:'Gym 5', idea:'<b>Horizontal and vertical.</b> The bar pull and the band pull-down are the same squeeze in two directions. Tempo is the cue of this block: three seconds down, one up.',
    prep:[ ['Game','Game · your choice','5 min',''], ['Mobility','World\'s Greatest Stretch','5 each side',''], ['Crawl','Inchworm to a push-up','5',''], ['Land','Hop and stick, forward','2 × 5 each leg','Land on one foot, quiet, hold two seconds'], ['Prehab','Shoulder taps in a plank','2 × 10','Hips still'] ],
    sub1:'Primary', learn:[ ['Hinge',1,'Bodyweight hinge, or kettlebell hinge if stamped','3 × 8 · tempo 3-1-1','Three seconds down. The bell is only for stamped hinges.',false], ['Pull',2,'Horizontal bar pull','3 × 8 · tempo 3-1-1','Feet further forward is harder. Choose the angle where eight is hard but clean.',false] ],
    sub2:'Accessory', work:[ ['Vertical pull','Band pull-down','2 × 10','Elbows to the ribs, no shrug'], ['Lower','Single-leg glute bridge','2 × 8 each side',''], ['Trunk','Side plank','2 × 20 s each side','Hips high'] ],
    finish:[ ['Finisher','Bike or shuttles','4 × 30 s on, 30 s off','Hard on, easy off'], ['Cool down','Hamstring and lat stretch','2 min',''] ] },
  { n:6, type:'Push', day:'Gym 6', idea:'<b>One leg and two legs.</b> The lunge is the honest version of the squat: it shows which side is weaker. Tempo again: three down, one up.',

// =====================================================================
// GYM RULES. Shown on the Rules tab (R key). Edit freely: each entry is
// [headline, one line of why or how]. Three boxes: Safety, Respect, How we train.
// =====================================================================
const RULES = {
  idea: '<b>The gym is shared, and it is heavy.</b> Three things keep everyone safe and everyone welcome: look after your body, look after the space, and train the way we train.',
  boxes: [
    { name:'Safety', mins:'Non-negotiable', cls:'', items:[
      ['Collars on every bar','Before the first rep, both ends'],
      ['Clear the bar path','Nobody walks in front of a lift. Step around, never through'],
      ['Ask before a new weight','A bigger weight than last time means a word with Mr Bain first'],
      ['Spot or be spotted','Bench and back squat with load get a spotter who knows the count'],
      ['Stop if it hurts','Sharp pain is a stop, not a push through. Tell a teacher'],
      ['Shoes on, laces done','Closed shoes always. Bare feet only where a teacher says so']
    ]},
    { name:'Respect', mins:'The space and each other', cls:'move', items:[
      ['Re-rack everything','Bars stripped, plates on the tree, bells back in size order'],
      ['Wipe down what you used','Bench, mat, pad. Spray is by the door'],
      ['Share the kit','Work in with someone on the same station. Nobody owns a rack'],
      ['Control the drop','Kettlebells and dumbbells are placed, not dropped'],
      ['Phones away','Filming for a stamp is the only screen time in the gym'],
      ['Leave it better','If you see something out of place, put it away, even if it is not yours']
    ]},
    { name:'How we train', mins:'The Athlete Academy way', cls:'', items:[
      ['Technique before load','A pattern gets weight when it is stamped, not before'],
      ['Last two reps hard, every rep clean','If a rep breaks down, the weight is too heavy. Go lighter and stay clean'],
      ['Follow the tempo','Three seconds down, one up, unless the Board says otherwise'],
      ['Aim for a 7 out of 10','Hard enough to matter, easy enough to repeat'],
      ['Rest between sets','Ninety seconds on the big lifts. Rushing is not effort'],
      ['Be honest on the Board','What you did is what you log. Nobody is impressed by a made-up number']
    ]}
  ]
};

const FLAT = []; UNIT.forEach(b => b.sessions.forEach(s => FLAT.push(Object.assign({block:b.block, blockTitle:b.title}, s))));
let cur = 0, exos = false, showRules = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/</g,'&lt;');

function renderTimeline(){
  $('timeline').innerHTML = UNIT.map(b => `<div class="blk"><div class="bl">Block ${b.block} · ${b.title}</div><div class="ss">${
    b.sessions.map(s => { const i = FLAT.findIndex(f => f.day===s.day);
      const cls = s.type==='Classroom' ? 'cls' : s.type.toLowerCase();
      return `<button type="button" class="s ${cls} ${(i===cur && !showRules)?'on':''}" data-i="${i}">${s.n}<small>${s.type==='Classroom'?'Class':s.type}</small></button>`; }).join('')
  }</div></div>`).join('');
}

function row(kind, eb, ex, rx, cue, pat, level, isNew, isTech){
  return `<button type="button" class="row" data-kind="${kind}" data-ex="${esc(ex)}" data-rx="${esc(rx)}" data-cue="${esc(cue||'')}" data-pat="${pat||''}" data-level="${level||''}">
    <div class="eb">${eb}${isNew?`<span class="new">New</span>`:''}</div>
    <div class="top"><span class="ex">${ex}</span><span class="rx ${isTech?'tech':''}">${rx}</span></div>
    ${cue?`<div class="cue">${cue}</div>`:''}</button>`;
}
function box(cls, name, mins, exosText, inner){
  return `<section class="box ${cls}"><div class="bh"><span class="n">${name}</span><span class="m">${mins}</span><span class="exos">${exosText}</span></div><div class="rows">${inner}</div></section>`;
}

function renderRules(){
  const head = `<div class="head"><div><div class="kicker">Intro to Training · every session</div><h1>Gym <span class="type">rules</span></h1></div><div class="idea">${RULES.idea}</div><div class="clk" id="clk2">00:00</div></div>`;
  const boxes = RULES.boxes.map(b => box(b.cls, b.name, b.mins, '', b.items.map((it,i) => `<div class="row rule" style="cursor:default"><div class="top"><span class="ex">${it[0]}</span><span class="rx" style="color:var(--mute)">${String(i+1).padStart(2,'0')}</span></div><div class="cue">${it[1]}</div></div>`).join(''))).join('');
  $('stage').innerHTML = head + `<div class="boxes rules-view">${boxes}</div><div class="foot"><div><b>Three things:</b> look after your body, look after the space, train the way we train.</div><div class="hide"><b>R</b> toggles this page. Arrows go back to the sessions.</div></div>`;
  syncClock();
}
function render(){
  $('rulesBtn').classList.toggle('on', showRules);
  if(showRules){ renderTimeline(); document.body.classList.toggle('exos-on', exos); renderRules(); return; }
  const s = FLAT[cur];
  renderTimeline();
  document.body.classList.toggle('exos-on', exos); $('exosTog').classList.toggle('on', exos); $('exosTog').setAttribute('aria-pressed', String(exos));
  const title = s.type==='Classroom' ? `Classroom ${s.n}` : `Session ${s.n} <span class="type">${s.type}</span>`;
  const head = `<div class="head"><div><div class="kicker">Block ${s.block} · ${s.blockTitle}</div><h1>${title}</h1></div><div class="idea">${s.idea}</div><div class="clk" id="clk2">00:00</div></div>`;
  if(s.type==='Classroom'){
    $('stage').innerHTML = head + `<div class="cls">${
      box('', 'What we do', '45 min', 'Portal, on laptops', `<ol>${s.cls.do.map(d=>`<li><span>${d[0]}<em>${d[1]}</em></span></li>`).join('')}</ol>`)}${
      box('move', 'Ticks', 'this session', '', `<ul>${s.cls.ticks.map(t=>`<li>${t}</li>`).join('')}</ul><p class="plain">Stamps are given in the gym, from the roster on the teacher's phone. The classroom is where you see them, check yourself against the criteria and say what is next.</p>`)}</div>`;
    return;
  }
  const prep = s.prep.map(p => row('prep', p[0], p[1], p[2], p[3])).join('');
  let move = `<div class="sub">${s.sub1}</div>` + s.learn.map(l => row('learn', l[0], l[2], l[3], l[4], l[0], l[1], l[5], l[3]===FILM)).join('');
  move += `<div class="sub">${s.sub2}</div>` + s.work.map(w => row('work', w[0], w[1], w[2], w[3])).join('');
  const fin = s.finish.map(f => row('finish', f[0], f[1], f[2], f[3])).join('');
  $('stage').innerHTML = head + `<div class="boxes">${
    box('prep', 'Prep', s.block===1?'10 min':'12 min', EXOS.prep, prep)}${
    box('move', 'Move', '25 min', EXOS.move, move)}${
    box('finish', 'Finish', '5 min', EXOS.finish, fin)}</div>
    <div class="foot"><div><b>Stamps</b> are given in any session, from the roster. A stamped pattern may use the loaded option where the Board offers one.</div><div class="hide"><b>Tap any line</b> to put it on screen. <b>F</b> for full screen, arrows to change session, space for the clock.</div></div>`;
  syncClock();
}

function openRow(btn){
  const d = btn.dataset, p = d.pat ? PATTERNS[d.pat] : null, lvl = parseInt(d.level)||0;
  const kind = d.kind==='learn'?'Learn':d.kind==='work'?'Practise':d.kind==='prep'?'Prep':'Finish';
  const left = `<div><div class="k">${kind}${d.pat?' · '+d.pat+' pattern':''}</div><h2>${d.ex}</h2><div class="rxbig">${d.rx}</div>${d.cue?`<div class="cuebig">${d.cue}</div>`:''}</div>`;
  const right = p ? `<div><h3>What good looks like</h3><ul class="crit">${p.criteria.map(c=>`<li><span>${c[0]}<em>${c[1]}</em></span></li>`).join('')}</ul>
      <h3 style="margin-top:22px">The ladder</h3><div class="ladder">${p.ladder.map((n,i)=>`<div data-n="${i+1}" class="${i+1===lvl?'here':(i+1<lvl?'done':'')}">${n}</div>`).join('')}</div></div>`
    : `<div><h3>Coaching note</h3><p class="plain">${d.cue || 'Keep it simple. Quality first, then speed.'}</p></div>`;
  $('card').innerHTML = left + right;
  $('overlay').classList.add('open'); $('back').focus();
}
function closeRow(){ $('overlay').classList.remove('open'); }

/* present mode: hide the teacher strip, go full screen if the browser allows */
function setPresent(on){
  document.body.classList.toggle('present', on);
  try{ if(on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
       if(!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
}
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement) document.body.classList.remove('present'); });

$('timeline').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; cur = +b.dataset.i; showRules = false; render(); });
$('rulesBtn').addEventListener('click', () => { showRules = !showRules; render(); });
$('stage').addEventListener('click', e => { const b = e.target.closest('button.row'); if(b) openRow(b); });
$('back').addEventListener('click', closeRow);
$('overlay').addEventListener('click', e => { if(e.target===$('overlay')) closeRow(); });
$('exosTog').addEventListener('click', () => { exos = !exos; render(); });
$('presentBtn').addEventListener('click', () => setPresent(true));

let t0=null, acc=0, tick=null;
const fmt = ms => String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
function syncClock(){ const v = fmt(acc + (tick ? Date.now()-t0 : 0)); $('clock').textContent = v; const c2 = $('clk2'); if(c2) c2.textContent = v; }
function toggleClock(){ if(tick){ acc += Date.now()-t0; clearInterval(tick); tick=null; } else { t0=Date.now(); tick=setInterval(syncClock,500); } syncClock(); }
$('clock').addEventListener('click', toggleClock);
document.addEventListener('keydown', e => {
  const open = $('overlay').classList.contains('open');
  if(e.key==='Escape'){ if(open) closeRow(); else setPresent(false); return; }
  if(e.key==='f' || e.key==='F'){ setPresent(!document.body.classList.contains('present')); return; }
  if(e.key==='r' || e.key==='R'){ showRules = !showRules; render(); return; }
  if(e.key===' ' && !e.target.closest('button')) { e.preventDefault(); toggleClock(); return; }
  if(e.key==='ArrowRight' && !open){ if(showRules){ showRules=false; } else { cur=(cur+1)%FLAT.length; } render(); }
  if(e.key==='ArrowLeft'  && !open){ if(showRules){ showRules=false; } else { cur=(cur+FLAT.length-1)%FLAT.length; } render(); }
});
render();
</script>
