<title>Training Age — prototype</title>
<!--
  TRAINING AGE AS A LIVE NUMBER, ON YOUR OWN TERM.

  The argument, settled: training age in the literature is accumulated
  appropriate training — years of it. It is not "how capable are you", it is
  "how much proper development is behind you". So a number that only moves when
  somebody runs a test is a worse model of the thing than one that accumulates
  as you train. Four of the ten attributes already moved weekly anyway
  (consistency, knowledge, movement, mindset), so the portal was already half
  way here without saying so.

  Three consequences, and they are the whole design:

    1. MEASURED IN YEARS. "1 yr 4 mo" explains itself to a student, to a coach
       at another school and on a CV. Out of ten needs a key every time, and
       caps out on a Grade 12 who has been in the programme three years.

    2. IT NEVER FALLS, AND IT NEVER RESETS. An age does not do either. Settled:
       a Grade 12 keeps the two years behind them, so three years on the
       programme reads as three years. That is the right behaviour for a number
       that goes on a CV, and it costs nothing here because the programme does
       not compare athletes with each other.

    3. THE RATE IS THE SIGNAL. If it only rises, the interesting question is how
       fast. A quiet week still ages you a little, because it does. A week that
       matched the plan ages you several times faster. That is what every input
       feeds, and it cannot be farmed by logging rubbish, because the big steps
       come from things somebody else assessed.

  WHERE AGE AND MATURITY COME IN — and they do, as their own named term rather
  than folded into anything else. The reason a quiet week is worth anything at
  all is that a fifteen-year-old is still developing without being trained; the
  reason it is worth less to a Grade 12 is that they are further past the growth
  spurt. So the floor splits in two:

      base    you are on the programme and a week went by.
      growth  you are still maturing. TAPERED BY AGE AND SEX.

  Both are small — together about a tenth of what a hard week is worth, which is
  roughly the share the youth-training literature gives to growth and maturation
  against a programme. What is deliberately NOT here is chronological age
  counting at anything like the rate of training: a year of being alive is not a
  year of training age, or a Grade 12 who did nothing would read three years.

  The literature keeps chronological age, biological maturity and training age
  as three separate axes precisely because conflating them misleads — that is
  the whole basis of bio-banding. This model keeps training age as the number
  and lets maturity set the floor under it, which is the one place it belongs.

  THIS PAGE READS YOUR REAL RECORD. It signs you in with Google and calls
  getPortalBootstrap, exactly as the portal does, and computes everything in the
  browser. Nothing is written to the sheet, and no athlete data reaches the
  repository or anybody building this. The one thing it does store is the
  "before Athlete Academy" answer, in this browser only, so the page remembers
  it between visits.

  The rates at the bottom are editable on purpose. The model is a proposal; the
  numbers in it are Scott's call, and this is the thing to make them on.
-->

<body>
<div class="wrap">

  <!-- ===== sign in ===== -->
  <div id="gate" class="card gate">
    <h1>Training Age, live</h1>
    <p>Signs you in and reads your own record. Nothing is written and nothing leaves your browser.</p>
    <div id="g_id_onload"
         data-client_id="701639243214-ud6m1qtmc6ma0pq6v24tk39afbuhcblv.apps.googleusercontent.com"
         data-context="signin" data-ux_mode="popup"
         data-callback="onCredential" data-auto_prompt="false"></div>
    <div class="g_id_signin" data-type="standard" data-shape="pill"
         data-theme="filled_black" data-text="signin_with" data-size="large"></div>
    <div id="gateErr"></div>
  </div>

  <div id="app" hidden></div>
</div>

<script>
const EXEC = 'https://script.google.com/macros/s/AKfycbwbJOS1zq2rn0LyKREtYfG1uMZMGJJvGaIz71mPowkFCvukic3FwnXDOYzRv8kCrODI/exec';

// ---- the model's rates, in WEEKS of training age -----------------------------
// Everything here is a proposal. Change them at the bottom of the page and the
// whole thing recomputes — that is what this prototype is for.
let RATES = {
  base:    0.1,   // every calendar week: you are on the programme and a week
                  // went by. Keeps exams and injury from being a punishment.
  growth:  0.2,   // every calendar week, SCALED BY MATURITY — see growthMult().
                  // This is the honest reason a quiet week is worth anything:
                  // an adolescent develops without being trained. It tapers as
                  // they move past the growth spurt, so a Grade 12 gets much
                  // less of it than a Grade 9.
  trained: 1.0,   // a week with any training in it
  strong:  0.5,   // ON TOP, for a week of three or more sessions
  test:    4.0,   // a fitness test that improved on the last one
  block:   3.0,   // a Level Up block passed
  stamp:   1.5    // each technique level signed off by a coach
};
// Calibration, so the numbers mean something: a full school year of good
// training (36 weeks, mostly three-session, a couple of blocks and two rounds
// of testing) lands near 16–17 months of training age. A year of turning up to
// nothing lands near 2–4, depending on how much growing is left. That spread is
// the claim — whether it is the right claim is Scott's call, which is what the
// editable rates are for.

// ---- maturity: where age enters, and how far it is allowed to -----------------
// Mean age at peak height velocity is about 13.5 in boys and 12 in girls. The
// strength spurt starts roughly 1.5 years before PHV and peaks around 0.5–1.0
// years after it, then growth-driven gains taper through the late teens. So the
// growth term is at full value just after PHV and decays to a floor about four
// years later — which, for a Grade 10–12 programme, means most of it is already
// spent and the term is deliberately small.
const MAT = {
  phv:  { M: 13.5, F: 12.0 },  // mean age at peak height velocity
  lag:  1.0,                   // peak strength velocity, years after PHV
  rise: 1.5,                   // the spurt starts this long before PHV
  span: 4.0,                   // years from the peak down to the floor
  floor: 0.15                  // what is left once growth is essentially done
};
function growthMult(age, sex){
  if(!isFinite(age)) return 1;
  const phv = MAT.phv[sex === 'F' ? 'F' : 'M'], peak = phv + MAT.lag;
  if(age >= peak)
    return Math.max(MAT.floor, 1 - (1 - MAT.floor) * Math.min(1, (age - peak) / MAT.span));
  const start = phv - MAT.rise;
  if(age <= start) return 0.5;
  return 0.5 + 0.5 * (age - start) / (peak - start);
}

// ---- the starting point a Grade 10+ arrives with ----------------------------
// A Grade 9 coming up through the programme has a real record, so their number
// builds itself. Everyone who joined later does not, and starting them at zero
// is a lie about a kid who has lifted with a club for two years. So: one survey
// question, capped by grade, because nobody can have been training for longer
// than they have been in school.
const GRADE_CAP = { 9: 0, 10: 1, 11: 2, 12: 3 };
// Approximate age at the middle of the school year. The Athletes sheet has no
// date of birth, so grade is what there is — and it is overridable below so the
// shape of the taper can be looked at directly.
const GRADE_AGE = { 9: 14.5, 10: 15.5, 11: 16.5, 12: 17.5 };

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseISO = s => { const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); };
const fmtISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mondayOf = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const addDays = (iso,n) => { const d=parseISO(iso); d.setDate(d.getDate()+n); return fmtISO(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice = iso => iso ? parseISO(iso).getDate()+' '+MON[parseISO(iso).getMonth()] : '';
const WEEKS_YR = 52.1775;

// Weeks of training age read as years and months, because that is the point.
function asAge(weeks){
  const months = weeks / 4.345;
  const y = Math.floor(months / 12), m = Math.round(months - y*12);
  if(m === 12) return { y: y+1, m: 0 };
  return { y, m };
}
function ageText(weeks){
  const a = asAge(weeks);
  if(a.y && a.m) return a.y+' yr '+a.m+' mo';
  if(a.y) return a.y+' yr';
  return a.m+' mo';
}
function months(weeks){ return Math.round(weeks / 4.345 * 10) / 10; }
// A week's worth is a few days of age. In months it rounds to nothing and the
// dial reads 0 / 0.3 / 0.4, which tells a student the opposite of the truth.
// Under two days it needs the decimal too, or a tapered growth term reads zero.
function days(weeks){
  const d = weeks * 7;
  return d < 2 ? Math.round(d*10)/10 : Math.round(d);
}

let DATA = null;
let PRIOR = null;      // self-reported years before Athlete Academy
let AGE_OVERRIDE = null;

// ---- who we are reading -----------------------------------------------------
function athleteGrade(){
  const a = DATA && DATA.athlete; if(!a) return null;
  const raw = String(a.Grade != null && a.Grade !== '' ? a.Grade : (a.Year_Group || ''));
  const n = parseInt(raw.replace(/[^0-9]/g, ''), 10);
  return (n >= 6 && n <= 13) ? n : null;
}
function athleteSex(){
  const g = String((DATA && DATA.athlete && DATA.athlete.Gender) || '').trim().toUpperCase();
  return g.charAt(0) === 'F' ? 'F' : 'M';
}
function athleteAge(){
  if(AGE_OVERRIDE != null) return AGE_OVERRIDE;
  const g = athleteGrade();
  return (g != null && GRADE_AGE[g] != null) ? GRADE_AGE[g] : 15.5;
}
function priorCap(){
  const g = athleteGrade();
  return (g != null && GRADE_CAP[g] != null) ? GRADE_CAP[g] : 3;
}
function priorKey(){
  return 'ta_prior_' + ((DATA && DATA.athlete && DATA.athlete.Athlete_ID) || 'x');
}
function priorYears(){
  if(PRIOR != null) return Math.max(0, Math.min(priorCap(), PRIOR));
  let v = 0;
  try { v = parseFloat(localStorage.getItem(priorKey())) || 0; } catch(e){ v = 0; }
  return Math.max(0, Math.min(priorCap(), v));
}

// ---- sign in ----------------------------------------------------------------
function onCredential(resp){
  $('gateErr').innerHTML = '<p class="note">Reading your record…</p>';
  fetch(EXEC + '?action=getPortalBootstrap&credential=' + encodeURIComponent(resp.credential))
    .then(r => r.text()).then(t => {
      let d; try { d = JSON.parse(t); } catch(e){ throw new Error('Unexpected response from the server'); }
      if(!d || d.success === false) throw new Error(d && d.error ? d.error : 'Could not read your record');
      DATA = d;
      $('gate').hidden = true; $('app').hidden = false;
      render();
    })
    .catch(e => { $('gateErr').innerHTML = '<div class="err">'+esc(e.message)+'</div>'; });
}
window.onCredential = onCredential;

// ---- the model --------------------------------------------------------------
// One pass over every week from the first one on record to this one. Each week
// adds its base and its growth, plus what was earned in it. Steps land on the
// week they are dated to; the ones the sheet does not date are credited at the
// start and said so, because inventing a date for them would make the curve a
// drawing rather than a record.
function build(){
  const load = (DATA.load && DATA.load.weeks) || [];
  const logged = (DATA.load && DATA.load.summary && DATA.load.summary.loggedDates) || [];
  const avail = DATA.availability || [];
  const testing = DATA.testing || [];

  // sessions per week, from the dated logs
  const perWeek = {};
  logged.forEach(d => { const w = fmtISO(mondayOf(parseISO(d))); perWeek[w] = (perWeek[w]||0)+1; });

  // weeks flagged injured or ill
  const flagged = {};
  avail.forEach(a => {
    if(!a || !a.from) return;
    let w = fmtISO(mondayOf(parseISO(a.from)));
    const end = a.to ? fmtISO(mondayOf(parseISO(a.to))) : w;
    let guard = 0;
    while(w <= end && guard++ < 80){ flagged[w] = (a.kind || 'out'); w = addDays(w, 7); }
  });

  // the span: first week on record → this week
  const allWeeks = load.map(w => w.weekStart).concat(Object.keys(perWeek)).filter(Boolean).sort();
  const nowW = fmtISO(mondayOf(new Date()));
  if(!allWeeks.length) return null;
  let w = allWeeks[0];

  // dated step events
  const steps = {};
  const addStep = (iso, kind, label) => {
    if(!iso) return;
    const k = fmtISO(mondayOf(parseISO(iso)));
    (steps[k] = steps[k] || []).push({ kind, label });
  };
  testing.forEach(t => { if(t.done && t.delta && t.delta.improved) addStep(t.date, 'test', t.label); });

  // how far back the first week is, so each week can be aged correctly: they
  // were younger then, and the growth term was worth slightly more.
  const sex = athleteSex(), ageNow = athleteAge();
  const spanWeeks = Math.max(0, Math.round((parseISO(nowW) - parseISO(allWeeks[0])) / 6048e5));

  const series = [], tally = { base:0, growth:0, trained:0, strong:0, test:0, block:0, stamp:0, prior:0 };
  const counts = { weeks:0, trainedWeeks:0, strongWeeks:0, flaggedWeeks:0, tests:0 };
  let total = 0, guard = 0, i = 0;
  while(w <= nowW && guard++ < 300){
    const n = perWeek[w] || 0;
    const out = !!flagged[w];
    const ageThen = ageNow - (spanWeeks - i) / WEEKS_YR;
    const gro = RATES.growth * growthMult(ageThen, sex);
    let gain = RATES.base + gro;
    counts.weeks++; tally.base += RATES.base; tally.growth += gro;
    if(n > 0){ gain += RATES.trained; tally.trained += RATES.trained; counts.trainedWeeks++; }
    if(n >= 3){ gain += RATES.strong; tally.strong += RATES.strong; counts.strongWeeks++; }
    if(out) counts.flaggedWeeks++;
    (steps[w] || []).forEach(st => {
      gain += RATES[st.kind]; tally[st.kind] += RATES[st.kind];
      if(st.kind === 'test') counts.tests++;
    });
    total += gain;
    series.push({ w, total, gain, n, out, steps: steps[w] || [] });
    w = addDays(w, 7); i++;
  }

  // CARRIED IN, not earned this term.
  //
  // Technique levels and passed blocks are cumulative — a Grade 11 arrives with
  // four patterns already stamped from last year — and the sheet records no
  // date for either. Counting them as growth made a seven-month term read as
  // nearly two years of training age, most of it work done before September.
  //
  // So they are the STARTING POINT, along with whatever training the athlete did
  // before they joined. The curve begins there and climbs from it, which is both
  // honest about where the number came from and a better answer to "what did I
  // add this term" — the thing the athlete actually wants.
  const blocks = Object.keys((DATA.learn && DATA.learn.blocks) || {}).filter(id => {
    const b = DATA.learn.blocks[id];
    return b && (b.status === 'passed' || b.passed === true);
  }).length;
  const stamps = (DATA.strengthLevels || []).reduce((a, l) => a + (l.done ? Math.max(0, (+l.tech||0)) : 0), 0);
  const prior = priorYears() * WEEKS_YR;
  tally.block = blocks * RATES.block;
  tally.stamp = stamps * RATES.stamp;
  tally.prior = prior;
  const carried = tally.block + tally.stamp + prior;
  series.forEach(p => { p.total += carried; });

  return { series, tally, counts, blocks, stamps, carried, prior,
           ageNow, sex, mult: growthMult(ageNow, sex),
           total: total + carried, earned: total };
}

// ---- the ten attributes, unchanged from the portal ---------------------------
// These survive underneath the one number, reframed: they stop being the
// headline and become the answer to "where is the growth coming from". Scoring
// is lifted from portal-lab so the prototype cannot quietly invent a second
// scheme that disagrees with the live card.
const CARD_T = {
  power:  {M:[160,180,200,220,240],      F:[130,145,155,165,180],      higher:true},
  speed:  {M:[6.5,6.0,5.5,5.0,4.8],      F:[7.5,7.0,6.5,6.0,5.7],      higher:false},
  agility:{M:[5.5,5.1,4.8,4.5,4.2],      F:[6.0,5.6,5.3,5.0,4.7],      higher:false},
  engine: {M:[1600,2000,2400,2800,3000], F:[1200,1600,2000,2400,2600], higher:true}
};
const CARD_TEST_KEY = { power:'broad_jump', speed:'sprint_40m', agility:'agility', engine:'cooper' };
const CARD_PATTERNS = ['Squat','Hinge','Push','Pull','Lunge','Press'];
const ATTRS = [
  { id:'strength',    label:'Strength',    grp:'body' },
  { id:'power',       label:'Power',       grp:'body' },
  { id:'speed',       label:'Speed',       grp:'body' },
  { id:'agility',     label:'Agility',     grp:'body' },
  { id:'engine',      label:'Engine',      grp:'body' },
  { id:'movement',    label:'Movement',    grp:'athlete' },
  { id:'mobility',    label:'Mobility',    grp:'athlete' },
  { id:'consistency', label:'Consistency', grp:'athlete' },
  { id:'knowledge',   label:'Knowledge',   grp:'athlete' },
  { id:'mindset',     label:'Mindset',     grp:'athlete' }
];
function cardScore10(key, v, g){
  const c = CARD_T[key]; if(!c || !v) return 0;
  const t = c[g === 'F' ? 'F' : 'M'], inc = c.higher, reached = (a,b) => inc ? a>=b : a<=b;
  if(!reached(v, t[0])){ const floor = inc ? t[0]*0.6 : t[0]*1.4;
    return Math.max(0, Math.min(2, (v-floor)/(t[0]-floor)*2)); }
  for(let i=0;i<4;i++) if(!reached(v, t[i+1]))
    return Math.max(0, Math.min(10, 2 + i*2 + (v-t[i])/(t[i+1]-t[i])*2));
  return 10;
}
function attrScores(){
  const lv = {}; (DATA.strengthLevels || []).forEach(l => { lv[l.pattern] = l; });
  const tech = k => (lv[k] && lv[k].tech) || 0, load = k => (lv[k] && lv[k].load) || 0;
  const g = athleteSex(), s = {};
  s.movement = CARD_PATTERNS.reduce((a,k) => a + tech(k), 0) / 6 / 5 * 10;
  s.strength = CARD_PATTERNS.reduce((a,k) => a + (tech(k) > 0 ? load(k) : 0), 0) / 6 / 5 * 10;
  ['power','speed','agility','engine'].forEach(k => {
    const t = (DATA.testing || []).find(x => x.key === CARD_TEST_KEY[k]);
    s[k] = (t && t.done && t.value) ? cardScore10(k, t.value, g) : 0;
  });
  s.mobility = (DATA.mobility && DATA.mobility.done) ? (DATA.mobility.score10 || 0) : 0;
  s.mindset  = (DATA.psych && DATA.psych.done) ? (DATA.psych.score10 || 0) : 0;
  const adh = DATA.grit && DATA.grit.parts && DATA.grit.parts.adherence;
  s.consistency = adh ? Math.min(10, (adh.pct || 0) / 10) : 0;
  const bl = (DATA.learn && DATA.learn.blocks) || {};
  const passed = Object.keys(bl).filter(k => bl[k] && (bl[k].status === 'passed' || bl[k].passed === true)).length;
  const started = Object.keys(bl).filter(k => bl[k] && !(bl[k].status === 'passed' || bl[k].passed === true)).length;
  s.knowledge = Math.min(10, passed + started * 0.35);
  return s;
}

// ---- render -----------------------------------------------------------------
function render(){
  const m = build();
  if(!m){ $('app').innerHTML = '<div class="card"><p class="note">No training weeks on record yet, so there is nothing to age.</p></div>'; return; }

  const name = (DATA.athlete && (DATA.athlete.Name || DATA.athlete.First_Name)) || 'You';
  const since = m.series[0];
  const a = asAge(m.total);
  const grade = athleteGrade(), cap = priorCap(), sex = m.sex;

  // what a week is worth, for the dial — at this athlete's own maturity
  const gro = RATES.growth * m.mult;
  const quiet = RATES.base + gro;
  const trained = quiet + RATES.trained;
  const strong = trained + RATES.strong;

  // Both strings are escaped. The one row that needs a badge gets it through a
  // flag rather than by being allowed to carry markup — a title parameter that
  // accepts HTML is exactly how an athlete's own text ends up executing.
  const srcRow = (icon, tone, title, sub, weeks, zero, badge) =>
    '<div class="src'+(zero?' zero':'')+'">'+
      '<span class="src-i'+(tone?' '+tone:'')+'"><i class="ti '+icon+'" aria-hidden="true"></i></span>'+
      '<span class="src-b"><span class="src-t">'+esc(title)+
        (badge ? '<span class="selfrep">'+esc(badge)+'</span>' : '')+'</span>'+
        '<span class="src-s">'+esc(sub)+'</span></span>'+
      '<span class="src-v">'+(weeks>0?'+':'')+months(weeks)+' mo</span>'+
    '</div>';

  const s = attrScores();
  const atRow = x =>
    '<div class="at'+(s[x.id] ? '' : ' none')+'">'+
      '<span class="at-n">'+esc(x.label)+'</span>'+
      '<span class="at-t"><i style="width:'+Math.max(2, (s[x.id]||0)*10)+'%"></i></span>'+
      '<span class="at-v">'+(s[x.id] ? s[x.id].toFixed(1)+'<u>/10</u>' : '–')+'</span>'+
    '</div>';

  // the taper, across the four grades this programme runs, so the size of the
  // age effect is visible rather than asserted
  const bandBox = g =>
    '<div class="mbx'+(g === grade ? ' me' : '')+'">'+
      '<div class="mbx-g">G'+g+'</div>'+
      '<div class="mbx-v">'+days(RATES.base + RATES.growth * growthMult(GRADE_AGE[g], sex))+'</div>'+
      '<div class="mbx-u">days a quiet week</div>'+
    '</div>';

  $('app').innerHTML =
    '<p class="lede"><b>Your real record.</b> Training age measured in years, accumulating from '+
    'everything you do — never falling, never resetting, growing faster when you train well. The rates at '+
    'the bottom are editable; this is the page to decide them on.</p>'+

    '<div class="card">'+
      '<p class="eyebrow"><i class="ti ti-hourglass-high" aria-hidden="true"></i> Training age'+
        '<span>'+esc(name)+(grade ? ' · G'+grade : '')+'</span></p>'+
      '<div class="ta"><span class="ta-y">'+(a.y||a.m)+'</span><span class="ta-u">'+
        (a.y ? ' yr '+a.m+' mo' : ' mo')+'</span></div>'+
      '<p class="ta-sub">You started on <b>'+ageText(m.carried)+' of training age</b> and have added <b>'+
        months(m.earned)+' months</b> across <b>'+m.counts.weeks+' weeks</b>, training in <b>'+
        m.counts.trainedWeeks+'</b> of them.</p>'+
      '<span class="grew"><i class="ti ti-trending-up" aria-hidden="true"></i> '+
        '+'+months(m.earned)+' months since '+nice(since.w)+'</span>'+
      '<svg id="curve" class="curve" viewBox="0 0 400 160" preserveAspectRatio="none"></svg>'+
      '<div class="legend">'+
        '<span><i style="background:var(--burgundy)"></i>Your training age</span>'+
        '<span><i style="background:#e8c450"></i>A week that earned a step</span>'+
        '<span><i style="background:#e8dcd4"></i>Injured or ill</span>'+
      '</div>'+
    '</div>'+

    '<div class="card">'+
      '<p class="eyebrow"><i class="ti ti-arrows-split" aria-hidden="true"></i> Where it came from</p>'+
      srcRow('ti-history', false, 'Before Athlete Academy',
             priorYears() ? priorYears()+' yr of training, capped at '+cap+' for Grade '+(grade||'?')
                          : 'Not answered yet — set it below',
             m.tally.prior, !m.tally.prior, 'self-reported')+
      srcRow('ti-calendar', false, 'Weeks on the programme', m.counts.weeks+' weeks, trained or not', m.tally.base, false)+
      srcRow('ti-seeding', 'sage', 'Still growing', 'Age '+m.ageNow.toFixed(1)+' · '+
             Math.round(m.mult*100)+'% of the growth rate left', m.tally.growth, false)+
      srcRow('ti-barbell', false, 'Weeks you trained', m.counts.trainedWeeks+' of '+m.counts.weeks, m.tally.trained, !m.counts.trainedWeeks)+
      srcRow('ti-flame', false, 'Weeks of three or more', m.counts.strongWeeks+' of '+m.counts.trainedWeeks, m.tally.strong, !m.counts.strongWeeks)+
      srcRow('ti-stopwatch', 'gold', 'Fitness tests improved', m.counts.tests+' since the first test', m.tally.test, !m.counts.tests)+
      srcRow('ti-book', 'gold', 'Level Up blocks passed', m.blocks+' passed', m.tally.block, !m.blocks)+
      srcRow('ti-rosette-discount-check', 'gold', 'Technique levels signed off', m.stamps+' levels across six patterns', m.tally.stamp, !m.stamps)+
      (m.carried > 0 ? '<div class="warn"><b>'+ageText(m.carried)+' of this was carried in.</b> '+
        'Technique levels and passed blocks are cumulative — most of them were earned before September — and '+
        'the sheet records no date for either, so they set where the curve starts rather than counting as this '+
        'term\'s growth. Give those rows a date column and they become steps on the line where they belong.</div>' : '')+
    '</div>'+

    '<div class="card tune">'+
      '<p class="eyebrow"><i class="ti ti-school" aria-hidden="true"></i> Before you got here'+
        '<span>one survey question</span></p>'+
      (cap > 0
        ? '<label><span>Years training, on your own or with a team</span>'+
            '<input type="number" step="0.5" min="0" max="'+cap+'" value="'+priorYears()+'" '+
            'oninput="setPrior(this.value)"></label>'+
          '<small>Capped at <b>'+cap+'</b> year'+(cap===1?'':'s')+' for '+(grade ? 'Grade '+grade : 'this grade')+
          ', because nobody can have been training for longer than they have been in high school. '+
          'A year here counts as a year of training age — which is already a quarter less than a year '+
          'inside the programme earns, so an optimistic answer cannot buy much. It is the only row on this '+
          'page nobody verified, and it is labelled that way.</small>'
        : '<small>Nothing to ask. A Grade 9 comes up through the programme, so the record builds the '+
          'number by itself — this question only exists for the athletes who joined later with years '+
          'behind them that the sheet never saw.</small>')+
      '<p class="note">Stored in this browser only — nothing is written to the sheet. Making it real means '+
      'one column on the Athletes tab and one question on the application form.</p>'+
    '</div>'+

    '<div class="card">'+
      '<p class="eyebrow"><i class="ti ti-chart-dots-3" aria-hidden="true"></i> Where the growth is coming from'+
        '<span>the ten, unchanged</span></p>'+
      '<div class="grp"><b>What you can do</b><i></i></div>'+
      ATTRS.filter(x => x.grp === 'body').map(atRow).join('')+
      '<div class="grp"><b>What it is built on</b><i></i></div>'+
      ATTRS.filter(x => x.grp === 'athlete').map(atRow).join('')+
      '<p class="note">These do not go away. They stop being the headline and become the explanation — one '+
      'number says how far you have come, these ten say what moved it.</p>'+
    '</div>'+

    '<div class="card">'+
      '<p class="eyebrow"><i class="ti ti-gauge" aria-hidden="true"></i> What a week is worth</p>'+
      '<div class="dial">'+
        '<div class="dl"><div class="dl-v">'+days(quiet)+'</div><div class="dl-l">days<br>a quiet week</div></div>'+
        '<div class="dl"><div class="dl-v">'+days(trained)+'</div><div class="dl-l">days<br>a week you trained</div></div>'+
        '<div class="dl best"><div class="dl-v">'+days(strong)+'</div><div class="dl-l">days<br>three or more</div></div>'+
      '</div>'+
      '<p class="note">A strong week is worth '+Math.round(strong/quiet)+'× a quiet one — and a week you '+
      'could not train is never worth less than the calendar. That is the whole argument: it cannot be lost, '+
      'and it cannot be farmed, because the big steps come from things somebody else assessed.</p>'+
    '</div>'+

    '<div class="card">'+
      '<p class="eyebrow"><i class="ti ti-ruler-measure" aria-hidden="true"></i> Age and maturity'+
        '<span>'+(sex === 'F' ? 'female' : 'male')+' curve</span></p>'+
      '<div class="mb">'+[9,10,11,12].map(bandBox).join('')+'</div>'+
      '<p class="note">The same quiet week, at each grade. Age is in the number — as the floor under it, '+
      'tapering as the growth spurt is spent. It is never worth more than about a tenth of a hard week.</p>'+
      '<label class="tune" style="display:flex;align-items:center;gap:10px;padding:10px 0 0;'+
        'font:500 12.5px Inter,sans-serif;color:var(--ink-soft)">'+
        '<span style="flex:1">Age to compute with</span>'+
        '<input type="number" step="0.5" min="9" max="25" value="'+m.ageNow+'" oninput="setAge(this.value)" '+
        'style="width:72px;font:600 13px Inter,sans-serif;text-align:right;border:1px solid var(--line);'+
        'border-radius:8px;padding:6px 8px;background:var(--cream)"></label>'+
      '<details><summary>Why age belongs here, and why only here</summary>'+
        '<p><b>A growing adolescent gets stronger without being trained.</b> Peak height velocity averages '+
        'about 13.5 years in boys and 12 in girls; the strength spurt runs from roughly 1.5 years before it '+
        'to 0.5–1 year after, then growth-driven gains taper through the late teens. That is the honest '+
        'reason a quiet week is worth anything at all, and the honest reason it is worth less to a Grade 12 '+
        'than a Grade 9.</p>'+
        '<p><b>But it is a floor, not a competitor.</b> The youth training evidence is that a programme '+
        'produces strength gains above and beyond growth and maturation — typically around 30% over 8–20 '+
        'weeks — so training has to dominate, and here it does by about ten to one. If a year of being '+
        'alive counted like a year of training, a Grade 12 who did nothing would read three years, and the '+
        'number would be worthless.</p>'+
        '<p><b>Which is why the literature keeps the three apart.</b> Chronological age, biological maturity '+
        'and training age are three separate axes, and conflating them is the specific error bio-banding '+
        'exists to fix: an early developer outperforms their age group on any test of strength, power or '+
        'speed, and reads close to average against athletes of their own maturity. This programme already '+
        'refuses that comparison — the card leads with distance travelled, not standing — so maturity gets '+
        'the floor and nothing more.</p>'+
        '<p><b>What it would take to do properly.</b> Real maturity needs either parental heights '+
        '(Khamis-Roche, for percentage of predicted adult height) or standing and seated height tracked '+
        'every three to six months (Mirwald, for years from PHV). Grade is standing in for both, which is '+
        'rough — and for a Grade 10–12 intake most of the spurt is already spent, so the error is small. '+
        'It would matter for a late-developing Grade 10, and it would matter a lot if this ever went below '+
        'Grade 9.</p>'+
        '<cite>Lloyd &amp; Oliver, Youth Physical Development Model, Strength Cond J 2012 · Cumming et al., '+
        'Bio-banding in Sport, Strength Cond J 2017 · Moran et al., maturation and short-term resistance '+
        'training, meta-analysis 2016 · Behringer et al., resistance training in children and adolescents, '+
        'meta-analysis 2010 · NSCA Youth Resistance Training position statement</cite>'+
      '</details>'+
    '</div>'+

    '<div class="card tune">'+
      '<p class="eyebrow"><i class="ti ti-adjustments" aria-hidden="true"></i> The rates <span>weeks of age, per thing</span></p>'+
      Object.keys(RATES).map(k =>
        '<label><span>'+({base:'Every calendar week',growth:'…and still growing (tapered)',
          trained:'A week with training in it', strong:'…and three or more sessions',
          test:'A fitness test improved', block:'A Level Up block passed',
          stamp:'A technique level stamped'}[k])+'</span>'+
        '<input type="number" step="0.1" min="0" value="'+RATES[k]+'" oninput="setRate(\'' + k + '\', this.value)"></label>'
      ).join('')+
      '<small>A school year of good training comes out around 14–17 months of training age on these numbers, '+
      'and a year of doing nothing around 2–4 depending on how much growing is left. Whether that spread is '+
      'right is your call, not the model\'s.</small>'+
    '</div>';

  drawCurve(m);
}

function setRate(k, v){
  const n = parseFloat(v);
  if(!isFinite(n) || n < 0) return;
  RATES[k] = n;
  render();
  // keep the field the user is typing in focused
}
window.setRate = setRate;

function setPrior(v){
  const n = parseFloat(v);
  if(!isFinite(n) || n < 0) return;
  PRIOR = Math.min(priorCap(), n);
  try { localStorage.setItem(priorKey(), String(PRIOR)); } catch(e){}
  render();
}
window.setPrior = setPrior;

function setAge(v){
  const n = parseFloat(v);
  if(!isFinite(n) || n < 9 || n > 25) return;
  AGE_OVERRIDE = n;
  render();
}
window.setAge = setAge;

function drawCurve(m){
  const svg = $('curve'); if(!svg) return;
  const W = 400, H = 160, pad = 8;
  const s = m.series, maxY = Math.max(1, s[s.length-1].total) * 1.08;
  const x = i => pad + i * (W - pad*2) / Math.max(1, s.length - 1);
  const y = v => H - pad - (v / maxY) * (H - pad*2);
  let out = '';
  s.forEach((p, i) => {
    if(!p.out) return;
    const w = (W - pad*2) / Math.max(1, s.length - 1);
    out += '<rect x="'+(x(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="#e8dcd4" opacity=".55"/>';
  });
  const line = s.map((p, i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(p.total).toFixed(1)).join(' ');
  out += '<path d="'+line+' L'+x(s.length-1).toFixed(1)+' '+(H-pad)+' L'+x(0).toFixed(1)+' '+(H-pad)+' Z" fill="url(#g)" opacity=".5"/>';
  out += '<path fill="none" stroke="var(--burgundy)" stroke-width="2.5" stroke-linejoin="round" d="'+line+'"/>';
  s.forEach((p, i) => {
    if(!p.steps.length) return;
    out += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.total).toFixed(1)+'" r="4.5" fill="#e8c450" stroke="#fff" stroke-width="2"/>';
  });
  out += '<circle cx="'+x(s.length-1).toFixed(1)+'" cy="'+y(s[s.length-1].total).toFixed(1)+
    '" r="5" fill="var(--burgundy)" stroke="#fff" stroke-width="2.5"/>';
  out += '<text class="ax" x="'+pad+'" y="'+(H+12)+'">'+nice(s[0].w)+'</text>';
  out += '<text class="ax" x="'+(W-pad)+'" y="'+(H+12)+'" text-anchor="end">'+ageText(s[s.length-1].total)+'</text>';
  svg.innerHTML = '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#874B46" stop-opacity=".45"/>'+
    '<stop offset="1" stop-color="#874B46" stop-opacity="0"/></linearGradient></defs>' + out;
}
</script>
