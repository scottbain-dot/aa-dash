<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One year view — prototype</title>
<!--
  PROTOTYPE — not wired to anything. Nothing here saves.

  The question: the Year tab plans a multi-sport year as a matrix — one row per
  sport, twelve columns. Reading it means merging the rows in your head, and the
  evidence says most of it never gets filled in (median 5 months of 12 per row,
  across 44 rows on the real roster).

  This shows the alternative: ONE timeline, months down the page, grouped into
  the season blocks the system already derives. Tap a month and you set every
  sport at once, so a year is twelve decisions however many sports you do,
  instead of sports × twelve.

  The five year maps below are REAL, pulled by Athlete_ID. No names, no emails.
  Edits are in memory only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#874B46; --burgundy-dark:#6a3a36; --gold:#D4AF37; --gold-light:#f5e6b3;
    --ink:#1f1b19; --ink-soft:#4a3f39; --ink-mute:#7a6a60; --cream:#fdf6f2; --line:#eee3dd;
    --st-build:#2b2521;   --st-build-ink:#f7f1ec;
    --st-maintain:#8c857e; --st-maintain-ink:#ffffff;
    --st-peak:#874b46;    --st-peak-ink:#faf3ed;
    --st-recover:#ffffff; --st-recover-ink:#2b2521;
    --st-off:#e9e3dd;     --st-off-ink:#8a7d73;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#fef8f6;color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding-bottom:60px}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-mute);margin:0 0 16px;line-height:1.5}

  /* ---- prototype chrome (not part of the design) ---- */
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .bar-lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);width:100%}
  .chip{font:600 12.5px 'Inter';background:#fff;border:1.5px solid var(--line);border-radius:999px;
        padding:7px 12px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
  .note{background:#fdf7e8;border:1px solid var(--gold-light);border-left:3px solid var(--gold);
        border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 14px}
  .note b{color:var(--burgundy-dark)}
  .same{font:600 11.5px 'Inter';color:var(--ink-mute)}
  .diff{font:700 11.5px 'Inter';color:var(--burgundy)}
  .flag{font:700 8.5px 'Inter';background:var(--gold-light);color:var(--burgundy-dark);
        border-radius:4px;padding:1px 4px;letter-spacing:.03em}
  .chip.on .flag{background:rgba(255,255,255,.85)}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;
        box-shadow:0 1px 2px rgba(26,20,17,.04)}
  .eyebrow{font:800 11px 'Inter';letter-spacing:.09em;text-transform:uppercase;color:var(--burgundy);margin:0 0 8px}
  .goal{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:700;line-height:1.3;margin:0 0 3px}
  .goal-sub{font-size:12px;color:var(--ink-mute);margin:0}

  /* ---- THE ONE YEAR VIEW ---- */
  .bhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
         padding:13px 0 7px;border-top:1px solid var(--line);margin-top:4px}
  .bhead:first-child{border-top:none;margin-top:0;padding-top:2px}
  .bhead-name{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:700}
  .bhead-when{font:800 10px 'Inter';letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
  .bhead-now{font:800 9.5px 'Inter';letter-spacing:.06em;text-transform:uppercase;
             background:var(--gold-light);color:var(--burgundy-dark);border-radius:999px;padding:3px 8px}
  .bhead-gap .bhead-name{color:var(--ink-mute);font-style:italic;font-weight:400}

  .mrow{display:flex;align-items:stretch;gap:9px;width:100%;text-align:left;cursor:pointer;
        background:none;border:none;border-radius:10px;padding:8px 6px;font:inherit}
  .mrow-bar{flex:0 0 6px;border-radius:3px;background:var(--st-off);align-self:stretch;min-height:22px}
  .bar-build{background:var(--st-build)} .bar-maintain{background:var(--st-maintain)}
  .bar-peak{background:var(--st-peak)}   .bar-recover{background:var(--st-recover);box-shadow:inset 0 0 0 1px var(--line)}
  .bar-off{background:var(--st-off)}
  .bar-none{background:repeating-linear-gradient(135deg,#f3ebe6 0 4px,#fff 4px 8px);box-shadow:inset 0 0 0 1px var(--line)}
  .bhead-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
  .mrow:hover{background:var(--cream)}
  .mrow.is-now{background:#fdf7e8}
  .mrow-m{flex:0 0 34px;font:800 10.5px 'Inter';letter-spacing:.06em;text-transform:uppercase;
          color:var(--ink-mute);padding-top:3px}
  .mrow.is-now .mrow-m{color:var(--burgundy)}
  .mrow-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .mrow-lead{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mrow-lead b{font-weight:700}
  .mrow-lead .ph{font-size:13px}
  .half{font-size:11px;color:var(--ink-mute);font-weight:600}
  .mrow-others{display:flex;flex-wrap:wrap;gap:5px}
  .oth{font:600 10.5px 'Inter';background:var(--cream);border:1px solid var(--line);
       border-radius:999px;padding:2px 8px;color:var(--ink-mute);white-space:nowrap}
  .mrow-comps{display:flex;flex-wrap:wrap;gap:4px}
  .cmp{font:800 9.5px 'Inter';background:var(--burgundy);color:#fff;border-radius:4px;padding:1px 5px}
  .mrow-empty{font-size:13px;color:var(--ink-mute);font-style:italic}
  .mrow-evs{display:flex;flex-wrap:wrap;gap:5px}
  .ev{font:700 10px 'Inter';background:var(--gold-light);color:var(--burgundy-dark);
      border-radius:999px;padding:3px 7px;white-space:nowrap}

  /* ---- THE ATHLETE VIEW ---- */
  .tgt{background:linear-gradient(160deg,#2b2521 0%,#3a312b 100%);color:#f7f1ec;border:none}
  .tgt .eyebrow{color:var(--gold)}
  .tgt-ev{font-family:'Fraunces',Georgia,serif;font-size:25px;font-weight:700;line-height:1.15;margin:0 0 5px}
  .tgt-when{font:700 13px 'Inter';color:var(--gold);margin:0 0 11px}
  .tgt-goal{font-size:13px;line-height:1.5;color:rgba(247,241,236,.8);margin:0}
  .tgt-bar{height:5px;border-radius:3px;background:rgba(247,241,236,.2);margin:14px 0 5px;overflow:hidden}
  .tgt-bar span{display:block;height:100%;background:var(--gold)}
  .tgt-bar-lab{font:600 10.5px 'Inter';color:rgba(247,241,236,.6)}

  .now-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 3px}
  .now-name{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:700}
  .now-wk{font:800 10px 'Inter';letter-spacing:.06em;text-transform:uppercase;
          background:var(--gold-light);color:var(--burgundy-dark);border-radius:999px;padding:3px 8px}
  .now-ask{font-size:14px;color:var(--ink-soft);line-height:1.5;margin:7px 0 0}
  .now-ask b{color:var(--ink)}
  .now-sports{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .now-sp{font:600 12px 'Inter';border-radius:999px;padding:5px 11px;border:1px solid var(--line);background:var(--cream)}
  .now-sp.lead{background:var(--st-build);color:#f7f1ec;border-color:var(--st-build)}
  .now-sp.peak{background:var(--st-peak);color:#faf3ed;border-color:var(--st-peak)}
  .now-stat{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
  .stat b{display:block;font-family:'Fraunces',Georgia,serif;font-size:21px;line-height:1.1}
  .stat span{font:600 10.5px 'Inter';letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute)}
  .now-next{font-size:12.5px;color:var(--ink-mute);margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
  .now-next b{color:var(--ink)}

  .sea{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
  .sea:first-of-type{border-top:none}
  .sea-dot{width:11px;height:11px;border-radius:50%;background:var(--st-peak);flex:0 0 auto}
  .sea.past .sea-dot{background:var(--line)}
  .sea.here .sea-dot{box-shadow:0 0 0 4px var(--gold-light)}
  .sea-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
  .sea-name{font:700 14px 'Inter'}
  .sea-sub{font-size:11.5px;color:var(--ink-mute)}
  .sea-away{font:800 11px 'Inter';color:var(--burgundy);white-space:nowrap}
  .sea-lede{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:14.5px;
            color:var(--ink-soft);margin:0 0 10px;line-height:1.45}

  .todo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--cream);
        border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px;cursor:pointer;font:inherit}
  .todo-i{flex:0 0 auto;font-size:15px}
  .todo-t{flex:1 1 auto;font-size:13px;color:var(--ink-soft);line-height:1.4}
  .todo-t b{color:var(--ink)}
  .plan-link{width:100%;background:none;border:1.5px solid var(--line);border-radius:12px;padding:13px;
             font:700 14px 'Inter';color:var(--burgundy);cursor:pointer;margin-top:4px}

  /* ---- THE YEAR STRIP: twelve tiles, every sport ----------------------
     The per-sport tile strip is the best thing in the Year tab — one row, a
     whole year, legible at a glance. Its only limit is that it shows ONE sport.
     This keeps the tile exactly as it is and makes it carry the others:
       · the tile's colour and emoji are the month's LEADING sport
       · the sport's name appears only where the lead CHANGES, so a handover
         reads as a handover instead of the same word printed twelve times
       · every other sport in that month is a pip in its own phase colour
       · the focus chips and the event markers stay where they were
  */
  .ystrip{display:grid;grid-template-columns:repeat(12,minmax(50px,1fr));gap:4px;
          overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 0 2px}
  @media (max-width:760px){
    .ystrip{grid-template-columns:repeat(6,1fr);gap:5px;overflow-x:visible;row-gap:5px;
            grid-auto-rows:1fr}   /* both rows the same height, or the year looks lopsided */
  }
  .ystrip::-webkit-scrollbar{display:none}
  .yst{min-height:104px;border-radius:13px;padding:7px 4px;cursor:pointer;position:relative;
       display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;
       text-align:center;background:var(--cream);border:none;font:inherit;transition:transform .12s}
  .yst:hover{transform:translateY(-1px)}
  .yst-m{font:700 9px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute)}
  .yst-e{font-size:19px;line-height:1}
  .yst-e.two{font-size:12px;letter-spacing:1px}
  .yst-sport{font:800 7.5px 'Inter';letter-spacing:.01em;text-transform:uppercase;line-height:1.2;
             max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}
  /* On a split tile the colour changes down the middle, so centred text lands
     on the seam and half of it disappears. Same fix the portal uses: give the
     label its own backing. */
  .yst.is-split .yst-m{background:rgba(0,0,0,.45);color:#fff;border-radius:6px;padding:0 5px}
  .yst.is-split .yst-sport{background:rgba(0,0,0,.45);color:#fff;border-radius:5px;padding:0 4px}
  .yst-pips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
  .yst-pip{width:13px;height:13px;border-radius:4px;font:800 7.5px 'Inter';line-height:13px;
           color:#fff;text-align:center}
  .pip-build{background:#2b2521}      .pip-maintain{background:#8c857e}
  .pip-peak{background:#874b46}       .pip-recover{background:#fff;color:#2b2521;box-shadow:inset 0 0 0 1px #d9cec7}
  .pip-off{background:#e9e3dd;color:#8a7d73}
  .yst-mark{font-size:9px;letter-spacing:1px;min-height:11px;color:var(--gold)}
  .yst-now{position:absolute;top:-7px;left:50%;transform:translateX(-50%);z-index:2;
           font:800 7.5px 'Inter';letter-spacing:.06em;background:var(--ink);color:#fff;
           border-radius:999px;padding:2px 7px}
  /* Tile colours, same palette as the portal. */
  .yst.p-build{background:var(--st-build)}    .yst.p-build .yst-m,.yst.p-build .yst-sport{color:var(--st-build-ink)}
  .yst.p-maintain{background:var(--st-maintain)} .yst.p-maintain .yst-m,.yst.p-maintain .yst-sport{color:#fff}
  .yst.p-peak{background:var(--st-peak)}      .yst.p-peak .yst-m,.yst.p-peak .yst-sport{color:var(--st-peak-ink)}
  .yst.p-recover{background:#fff;box-shadow:inset 0 0 0 1px var(--line)} .yst.p-recover .yst-m,.yst.p-recover .yst-sport{color:var(--ink)}
  .yst.p-off{background:var(--st-off)}        .yst.p-off .yst-m,.yst.p-off .yst-sport{color:var(--st-off-ink)}
  .yst.p-none{background:#faf5f2;box-shadow:inset 0 0 0 1px #e8ddd7}
  .yst.p-none .yst-m{color:var(--ink-mute)}
  .yst-plus{font-family:'Fraunces',serif;font-size:17px;color:var(--ink-mute);line-height:1}
  .yst.is-now{outline:2px solid var(--gold);outline-offset:1px}
  .ystrip-legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin:2px 0 2px}
  .ystrip-foot{font:500 11.5px 'Inter';color:var(--ink-mute);margin:10px 0 0;text-align:center}

  /* ---- today's grid, for comparison ---- */
  .yog{display:grid;grid-template-columns:clamp(52px,17vw,96px) repeat(12,1fr);gap:3px;align-items:center}
  .yog-mhead{font:700 8.5px 'Inter';text-transform:uppercase;text-align:center;color:var(--ink-mute)}
  .yog-label{font:700 11.5px 'Fraunces',serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
  .yog-cell{aspect-ratio:1/1;border-radius:5px;background:var(--cream);display:flex;align-items:center;
            justify-content:center;font-size:clamp(9px,2vw,15px)}
  .ym-build{background:var(--st-build)} .ym-maintain{background:var(--st-maintain)}
  .ym-peak{background:var(--st-peak)}   .ym-recover{background:var(--st-recover);border:1px solid var(--line)}
  .ym-off{background:var(--st-off)}
  .ghost{background:#faf5f2;border:1px dashed #e3d8d2}
  .junk{opacity:.5}
  .junk-tag{font:700 8.5px 'Inter';background:#f6e0dc;color:#7c3b33;border-radius:4px;padding:1px 4px;margin-left:4px}

  /* ---- month sheet ---- */
  .backdrop{position:fixed;inset:0;background:rgba(31,27,25,.45);display:none;z-index:40}
  .backdrop.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;z-index:41;
         border-radius:20px 20px 0 0;padding:18px 16px 28px;display:none;box-shadow:0 -8px 40px rgba(26,20,17,.18)}
  .sheet.open{display:block}
  .sheet-inner{max-width:720px;margin:0 auto}
  .sheet h2{font-family:'Fraunces',Georgia,serif;font-size:21px;margin:2px 0 2px}
  .sheet .lede{font-size:12.5px;color:var(--ink-mute);margin:0 0 14px;line-height:1.5}
  .sp-row{border-top:1px solid var(--line);padding:11px 0}
  .sp-row:first-of-type{border-top:none}
  .sp-name{font:700 13.5px 'Inter';margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sp-half{font:600 11px 'Inter';color:var(--burgundy);background:none;border:none;cursor:pointer;padding:0}
  .pills{display:flex;flex-wrap:wrap;gap:5px}
  .pill{font:600 12px 'Inter';background:#fff;border:1.5px solid var(--line);border-radius:999px;
        padding:7px 11px;cursor:pointer;color:var(--ink);min-height:36px}
  .pill.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .pill.sel[data-s="peak"]{background:var(--st-peak);border-color:var(--st-peak)}
  .pill.sel[data-s="maintain"]{background:var(--st-maintain);border-color:var(--st-maintain)}
  .pill.sel[data-s="recover"],.pill.sel[data-s="off"]{background:var(--st-off);border-color:#d8cec7;color:var(--ink)}
  .pills2{margin-top:6px;padding-left:10px;border-left:2px solid var(--line)}
  .pills2 .lab{font:600 10.5px 'Inter';color:var(--ink-mute);display:block;margin-bottom:4px}
  .sheet-sec{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
  .sheet-sec p{font:800 10.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 4px}
  .sheet-sec .hint{font:400 12px 'Inter';letter-spacing:0;text-transform:none;color:var(--ink-mute);margin:0 0 9px;line-height:1.45}
  .done{width:100%;margin-top:16px;background:var(--burgundy);color:#fff;border:none;border-radius:12px;
        padding:14px;font:700 15px 'Inter';cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>One year view</h1>
  <p class="sub">Prototype. Five <strong>real</strong> year maps, pulled by Athlete&nbsp;ID — no names, no emails.
     Nothing saves; edits live in this page only.</p>

  <div class="bar">
    <span class="bar-lab">Athlete</span>
    <span id="whoBar"></span>
  </div>
  <div class="bar" id="groupBar">
    <span class="bar-lab">Blocks cut by</span>
    <button class="chip on" id="gSport" onclick="setGrouping('sport')">Leading sport</button>
    <button class="chip" id="gWork" onclick="setGrouping('work')">Kind of work</button>
    <span id="groupSame"></span>
  </div>
  <div class="bar">
    <span class="bar-lab">View</span>
    <button class="chip on" id="vStrip" onclick="setView('strip')">Year strip</button>
    <button class="chip" id="vAth" onclick="setView('ath')">What the athlete sees</button>
    <button class="chip" id="vNew" onclick="setView('new')">Planner</button>
    <button class="chip" id="vOld" onclick="setView('old')">Today’s grid</button>
  </div>

  <noscript><div class="note"><b>This page needs JavaScript.</b> If you are seeing this,
    the viewer you opened it in is not running scripts — open
    scottbain-dot.github.io/aa-dash/year-view-prototype.html in a browser instead.</div></noscript>
  <div id="dataNote"></div>
  <div id="main"></div>
</div>

<div class="backdrop" id="bd" onclick="closeMonth()"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>

<script>
/* ============================================================
   REAL DATA — five year maps, keyed by Athlete_ID only.

/* The sports whose plan the season actually reads — the same rule the portal
   uses. A combined row is dropped ONLY when a real sport has been planned,
   which is how an athlete can have twelve months of planning that counts for
   nothing and never be told. */
function plannedSports(){
  const all = (ym().sports || []);
  const real = all.filter(s => !isSignupRow(s) && (s.monthlyStates||[]).some(m => m.state));
  return real.length ? real : all.filter(s => (s.monthlyStates||[]).length);
}
function stateOf(sp, month, half){
  const m = (sp.monthlyStates||[]).find(x => x.month === month);
  if(!m || !m.state) return '';
  return (half === 1 && m.state2) ? m.state2 : m.state;
}
function monthRec(sp, month){ return (sp.monthlyStates||[]).find(x => x.month === month) || null; }
function isSplit(month){ return plannedSports().some(sp => { const m = monthRec(sp, month); return !!(m && m.state2); }); }

/* Months run together into a block while the leading sport and the KIND of
   work stay the same. Unplanned months group into their own run, so a gap
   reads as a gap instead of being quietly filled in with a guess. */
function blocks(){
  const out = [];
  academicCells().forEach(cell => {
    const halves = isSplit(cell.month) ? [0,1] : [0];
    halves.forEach(half => {
      const r = rankedAt(cell.month, half);
      const lead = r[0] || null;
      // Two ways to cut the year up, and they disagree for an athlete whose
      // sports both build all year. BY SPORT keeps the leading sport in the key,
      // so the block changes the moment the lead flips — honest, but it can give
      // you thirteen blocks in twelve months. BY WORK keys on the KIND of work
      // only, so a block is a stretch with one job and the sports are what is
      // happening inside it.
      const tier = lead ? (PHASE_TIER[lead.phase]||'build') : '';
      const key = lead ? ((grouping === 'sport' ? lead.sp.name + '|' : '') + tier) : 'GAP';
      const last = out[out.length-1];
      const seg = { month: cell.month, year: cell.year, half, split: halves.length>1,
                    lead, others: r.slice(1) };
      if(last && last.key === key) last.segs.push(seg);
      else out.push({ key, lead, segs:[seg] });
    });
  });
  out.forEach(b => {
    b.months = b.segs.map(s => s.month).filter((m,i,a) => a.indexOf(m)===i);
    b.weeks = Math.round(b.segs.reduce((a,s) => a + (s.split ? 2.17 : 4.35), 0));
    const tier = b.lead ? (TIER_LABEL[PHASE_TIER[b.lead.phase]] || 'build') : '';
    // Name a block for its sport only when one sport leads the whole of it.
    const leads = b.segs.map(sg => sg.lead && sg.lead.sp.name).filter(Boolean);
    const oneSport = leads.length && leads.every(n => n === leads[0]);
    b.label = !b.lead ? 'Not planned yet'

}
const mShort = m => m.slice(0,3);

function compsIn(month){
  // Proposed: the focus belongs to the MONTH, not to each sport. Until that
  // lands, read whatever any sport recorded for the month.
  const set = [];
  plannedSports().forEach(sp => { const m = monthRec(sp, month);
    (m && m.components || []).forEach(c => { if(set.indexOf(c) < 0) set.push(c); }); });
  if(ym()._monthComps && ym()._monthComps[month]) return ym()._monthComps[month];
  return set;
}

function monthRowHTML(seg){
  const isNow = seg.month === NOW_MONTH && seg.half === 0;
  const comps = compsIn(seg.month);
  const evs = seg.half === 0 ? eventsIn(seg.month) : [];
  let body;
  if(seg.lead){
    const half = seg.split ? '<span class="half">· '+(seg.half ? '2nd half' : '1st half')+'</span>' : '';
    body = '<span class="mrow-lead"><span class="ph">'+PHASE_EMOJI[seg.lead.phase]+'</span> '+
             '<b>'+esc(seg.lead.sp.name)+'</b> '+PHASE_WORD[seg.lead.phase]+' '+half+'</span>'+
           (seg.others.length
             ? '<span class="mrow-others">'+seg.others.map(o =>
                 '<span class="oth">'+esc(o.sp.name)+' '+PHASE_EMOJI[o.phase]+' '+PHASE_WORD[o.phase]+'</span>').join('')+'</span>'
             : '')+
           (comps.length ? '<span class="mrow-comps">'+comps.map(c => '<span class="cmp">'+esc(compLabel(c))+'</span>').join('')+'</span>' : '')+
           (evs.length ? '<span class="mrow-evs">'+evs.map(e => '<span class="ev">🏆 '+esc(e)+'</span>').join('')+'</span>' : '');
  } else {
    body = '<span class="mrow-empty">Nothing set — tap to plan this month</span>';
  }
  const bar = seg.lead ? 'bar-'+seg.lead.phase : 'bar-none';
  return '<button class="mrow'+(isNow?' is-now':'')+'" onclick="openMonth(\''+seg.month+'\')">'+
    '<span class="mrow-bar '+bar+'" aria-hidden="true"></span>'+
    '<span class="mrow-m">'+mShort(seg.month)+'</span>'+
    '<span class="mrow-body">'+body+'</span>'+
  '</button>';
}

function newViewHTML(){

    (m.goal ? '<p class="goal">'+esc(m.goal)+'</p>' : '<p class="goal">No goal set yet.</p>')+

      (m.aPriority.month? ' · '+esc(m.aPriority.month):'')+'</p>' : '')+
  '</div>';

  html += '<div class="card">';
  bs.forEach(b => {
    const isNow = b === nowBlock;
    let weekIn = '';
    if(isNow){
      const i = b.segs.findIndex(s => s.month === NOW_MONTH);
      weekIn = '<span class="bhead-now">Now · week '+(Math.round(i*4.35)+1)+' of '+b.weeks+'</span>';

    html += '<div class="bhead'+(b.gap?' bhead-gap':'')+'">'+

      '<span class="bhead-name">'+esc(b.label)+'</span>'+ weekIn +
    '</div>';
    html += b.segs.map(monthRowHTML).join('');
  });
  html += '</div>';
  return html;
}

  const L = LOAD[who]; if(!L || !range) return { weeks:0, load:0 };
  const ws = (L.lastWeeks||[]).filter(w => w.w >= range.from && w.w <= range.to);
  return { weeks: ws.length, load: ws.reduce((a,w) => a + (w.load||0), 0) };
}
const ASK = {
  build:    'Room to build. <b>2–3 sessions a week of your own</b> on top of your sport.',
  maintain: 'Your sport leads. <b>1 session a week of your own</b> holds what you have.',
  peak:     'Competition time. <b>Keep it sharp</b> — hard but short, and arrive fresh.',
  recover:  '<b>Deliberate rest.</b> Light movement, nothing hard.',
  off:      '<b>A proper break.</b> Nothing planned.'
};

function seasonLede(seasons, cur){
  const next = seasons.map(b => ({ b, away: (blockRange(b)||{}).from ? weeksBetween(NOW_ISO, blockRange(b).from) : null }))
                      .filter(x => x.away != null && x.away > 0).sort((a,b) => a.away - b.away)[0];
  const n = seasons.length;
  if(seasons.indexOf(cur) >= 0) return 'You are in one now. ' + (n>1 ? 'There ' + (n-1===1?'is':'are') + ' ' + (n-1) + ' more this year.' : '');
  if(next) return (n===1 ? 'One season to be ready for' : n + ' seasons this year') +
    ' — the first is <strong>' + next.away + ' weeks away</strong>.';
  return n === 1 ? 'One season to be ready for.' : n + ' seasons this year.';
}

function athleteViewHTML(){
  const m = ym(), ap = m.aPriority, bs = blocks(), cur = nowBlockIn(bs);
  const cells = academicCells();
  const yearFrom = dISO(new Date(Date.UTC(cells[0].year, 7, 1)));
  const yearTo   = dISO(new Date(Date.UTC(cells[11].year, 7, 0)));
  const through  = Math.max(0, Math.min(100, Math.round(weeksBetween(yearFrom, NOW_ISO) / 52 * 100)));

  /* 1. What am I aiming at. */
  let html = '<div class="card tgt">';
  if(ap && ap.event){
    const away = ap.date ? weeksBetween(NOW_ISO, ap.date) : null;
    html += '<p class="eyebrow">Your target</p>'+
      '<p class="tgt-ev">'+esc(ap.event)+'</p>'+
      '<p class="tgt-when">'+(ap.date ? new Date(ap.date).toDateString().slice(4) : esc(ap.month||''))+
        (away!=null && away>0 ? ' · <strong>'+away+' weeks away</strong>' : '')+'</p>';
  } else {
    html += '<p class="eyebrow">Your target</p><p class="tgt-ev">No big event set.</p>';
  }
  if(m.goal) html += '<p class="tgt-goal">“'+esc(m.goal)+'”</p>';
  html += '<div class="tgt-bar"><span style="width:'+through+'%"></span></div>'+
          '<p class="tgt-bar-lab">'+through+'% through your year</p></div>';

  /* 2. What this stretch is for, and what I have actually done in it. */
  if(cur){
    const r = blockRange(cur), t = trainingIn(r);
    const i = cur.segs.findIndex(s => s.month === NOW_MONTH);
    const wk = Math.round(i*4.35)+1;
    const seg = cur.segs[i] || cur.segs[0];
    const lead = seg && seg.lead;
    const phase = lead ? lead.phase : '';
    const idx = bs.indexOf(cur), nxt = bs[idx+1];
    html += '<div class="card">'+
      '<p class="eyebrow">Right now</p>'+
      '<div class="now-h"><span class="now-name">'+esc(cur.label)+'</span>'+
        '<span class="now-wk">Week '+wk+' of '+cur.weeks+'</span></div>'+
      (ASK[phase] ? '<p class="now-ask">'+ASK[phase]+'</p>' : '')+
      (seg ? '<div class="now-sports">'+
        [].concat(lead?[{sp:lead.sp,phase:lead.phase,lead:true}]:[], (seg.others||[]).map(o=>({sp:o.sp,phase:o.phase})))
        .map(o => '<span class="now-sp '+(o.phase==='peak'?'peak':(o.lead?'lead':''))+'">'+
            PHASE_EMOJI[o.phase]+' '+esc(o.sp.name)+' · '+PHASE_WORD[o.phase]+'</span>').join('')+
      '</div>' : '')+
      '<div class="now-stat">'+
        '<span class="stat"><b>'+t.weeks+' <span style="font-size:13px;color:var(--ink-mute)">of '+cur.weeks+'</span></b>'+
          '<span>weeks trained<br>this block</span></span>'+
        '<span class="stat"><b>'+(LOAD[who]?LOAD[who].weeksTrained:0)+'</b><span>weeks trained<br>this year</span></span>'+
        '<span class="stat"><b>'+(cur.weeks - wk + 1)+'</b><span>weeks left<br>in this block</span></span>'+
      '</div>'+
      (nxt ? '<p class="now-next">Then: <b>'+esc(nxt.label)+'</b> · '+nxt.weeks+' weeks</p>' : '')+
    '</div>';
  }

  /* 3. The year as the thing an athlete can hold in their head: the seasons. */
  const seasons = bs.filter(b => b.lead && PHASE_TIER[b.lead.phase] === 'compete');
  if(seasons.length){
    html += '<div class="card"><p class="eyebrow">Your seasons this year</p>'+
      '<p class="sea-lede">'+seasonLede(seasons, cur)+'</p>';
    seasons.forEach(b => {
      const r = blockRange(b);
      const away = r ? weeksBetween(NOW_ISO, r.from) : null;
      const here = b === cur, past = away != null && away < 0 && !here;
      html += '<div class="sea'+(here?' here':'')+(past?' past':'')+'">'+
        '<span class="sea-dot"></span>'+
        '<span class="sea-body"><span class="sea-name">'+esc(b.label)+'</span>'+
          '<span class="sea-sub">'+rangeLabel(b)+' · '+b.weeks+' weeks</span></span>'+
        '<span class="sea-away">'+(here ? 'NOW' : past ? 'done' : (away>0? away+' wks':'soon'))+'</span>'+
      '</div>';
    });
    html += '</div>';
  }

  /* 4. The gaps, as things to do rather than blanks to notice. */
  const todos = [];
  const unset = [];
  academicCells().forEach(c => { if(!rankedAt(c.month,0).length) unset.push(c.month); });
  const junkRows = (m.sports||[]).filter(isSignupRow);
  if(junkRows.length) todos.push(['🏷️','<b>Your sports are stored as one line</b> — “'+esc(junkRows[0].name)+
    '”. Split them and each one can have its own season.','']);
  if(!m.goal) todos.push(['🎯','You have not written down <b>what you are chasing</b> this year.','']);
  if(!ap || !ap.event) todos.push(['🏁','No big event set — <b>the thing the year points at</b>.','']);
  if(unset.length) todos.push(['📅','<b>'+unset.length+' month'+(unset.length>1?'s':'')+' not planned</b> — '+
    unset.slice(0,3).map(x=>x.slice(0,3)).join(', ')+(unset.length>3?'…':'')+'. Two taps each.', unset[0]]);
  if(cur && !compsIn(NOW_MONTH).length) todos.push(['💪','<b>No focus set for this month.</b> What are you actually building?', NOW_MONTH]);
  if(todos.length){
    html += '<div class="card"><p class="eyebrow">Needs you</p>'+
      todos.map(t => '<button class="todo"'+(t[2]?' onclick="openMonth(\''+t[2]+'\')"':'')+'>'+
        '<span class="todo-i">'+t[0]+'</span><span class="todo-t">'+t[1]+'</span></button>').join('')+
    '</div>';
  }
  html += '<button class="plan-link" onclick="setView(\'new\')">Plan my months →</button>';
  return html;
}

/* ============================================================
   THE YEAR STRIP — one row, twelve months, every sport
   ============================================================ */
const PIP_LETTER = nm => String(nm||'').trim().charAt(0).toUpperCase();
// What each phase asks of the athlete, in sessions a week — the same words the
// portal legend uses. The number is their OWN training, not their sport's.
const PHASE_SHORT = { build:'add 2–3 of your own a week', maintain:'add 1 of your own a week',
                      peak:'sport first, volume down', recover:'rest', off:'off' };
// Up to `max` focus chips, then "+n". Same shape as the portal's.
function compChips(ids, max){
  const list = (ids||[]).map(compLabel).filter(Boolean);
  if(!list.length) return '';
  const show = list.slice(0, max||2), extra = list.length - show.length;
  return '<span class="yog-comps">'+show.map(x=>'<b>'+esc(x)+'</b>').join('')+
         (extra?'<b>+'+extra+'</b>':'')+'</span>';
}

function stripTile(month, prevLead){
  const split = isSplit(month);
  const r0 = rankedAt(month, 0);
  const r1 = split ? rankedAt(month, 1) : r0;
  const lead0 = r0[0] || null, lead1 = r1[0] || null;
  const p0 = lead0 ? lead0.phase : '', p1 = lead1 ? lead1.phase : '';
  const isNow = month === NOW_MONTH;

  // Colour: one phase, or a hard 50/50 split when the halves differ.
  let cls = 'yst p-' + (p0 || 'none'), style = '';
  if(split && p1 && p1 !== p0){
    cls += ' is-split';
    style = ' style="background:linear-gradient(90deg,var(--st-'+(p0||'off')+') 0 50%,var(--st-'+p1+') 50% 100%)"';
  }

  const emoji = p0
    ? (split && p1 && p1 !== p0
        ? '<span class="yst-e two">'+PHASE_EMOJI[p0]+PHASE_EMOJI[p1]+'</span>'
        : '<span class="yst-e">'+PHASE_EMOJI[p0]+'</span>')
    : '<span class="yst-plus">+</span>';

  // The lead sport's name, only where the lead changes. Twelve repetitions of
  // the same word is wallpaper; a name appearing is a handover.
  const leadName = lead0 ? lead0.sp.name : '';
  const showName = leadName && leadName !== prevLead;
  const nameHTML = showName ? '<span class="yst-sport">'+esc(shortSport(leadName))+'</span>' : '';

  // Everything else happening that month, as a pip in its own phase colour.
  const seen = {}; const pips = [];
  r0.concat(split ? r1 : []).forEach(function(o){
    const nm = o.sp.name;
    if(nm === leadName) return;
    if(seen[nm]) return; seen[nm] = 1;
    const half2 = split ? (r1.find(x => x.sp.name === nm) || {}).phase : '';
    const title = esc(nm) + ' · ' + PHASE_WORD[o.phase] +
                  (half2 && half2 !== o.phase ? ' → ' + PHASE_WORD[half2] : '');
    pips.push('<span class="yst-pip pip-'+o.phase+'" title="'+title+'">'+esc(PIP_LETTER(nm))+'</span>');
  });

  const comps = compsIn(month);
  const chips = comps.length ? compChips(comps, 2) : '';
  const evs = eventsIn(month);
  const marks = (evs.length ? '★' : '') + (gamesIn(month).length ? '●' : '');

  return '<button class="'+cls+(isNow?' is-now':'')+'"'+style+' onclick="openMonth(\''+month+'\')">'+
    (isNow ? '<span class="yst-now">NOW</span>' : '')+
    '<span class="yst-m">'+mShort(month)+'</span>'+
    emoji + nameHTML +
    (pips.length ? '<span class="yst-pips">'+pips.join('')+'</span>' : '')+
    chips +
    (marks ? '<span class="yst-mark">'+marks+'</span>' : '')+
  '</button>';
}

// "Cross Country" in a 58px tile is three unreadable lines. Initials for a
// multi-word sport, the name itself when it is short enough to read.
function shortSport(nm){
  const n = String(nm||'').trim();
  if(n.length <= 11) return n;
  // "Track and Field" initialised blindly gives TAF. Drop the joining words,
  // then it reads T&F.
  const stop = { and:1, of:1, the:1 };
  const joined = /\band\b|&/i.test(n) ? '&' : '';      // Track and Field → T&F, Cross Country → CC
  const parts = n.split(/[\s&]+/).filter(Boolean).filter(w => !stop[w.toLowerCase()]);
  if(parts.length > 1) return parts.map(w => w.charAt(0).toUpperCase()).join(joined);
  return n.slice(0, 10) + '…';
}
function gamesIn(month){
  const L = LOAD[who]; if(!L) return [];
  const ap = ym().aPriority, apDate = (ap && ap.date) || '';
  return (L.games||[]).filter(g => g.date && g.date !== apDate &&
    MONTHS[new Date(g.date+'T00:00:00Z').getUTCMonth()] === month);
}

function yearStripHTML(){
  const m = ym(), ap = m.aPriority;
  let prev = '', tiles = '';
  academicCells().forEach(function(c){
    tiles += stripTile(c.month, prev);
    const r = rankedAt(c.month, 0);
    if(r[0]) prev = r[0].sp.name;
  });
  const sports = plannedSports().map(s => s.name);
  return '<div class="card">'+
    '<p class="eyebrow">Your year · '+esc(m.year||'')+'</p>'+
    (m.goal ? '<p class="goal">'+esc(m.goal)+'</p>' : '')+
    (ap && ap.event ? '<p class="goal-sub">Big event · <strong>'+esc(ap.event)+'</strong>'+
      (ap.month? ' · '+esc(ap.month):'')+'</p>' : '')+
    '<div class="ystrip-legend" style="margin-top:12px">'+
      ['build','maintain','peak','recover'].map(p =>
        '<span class="year-legend-item"><span class="legend-emoji">'+PHASE_EMOJI[p]+'</span>'+
        '<strong>'+p.charAt(0).toUpperCase()+p.slice(1)+'</strong> · '+PHASE_SHORT[p]+'</span>').join('')+
    '</div>'+
    '<div class="ystrip">'+tiles+'</div>'+
    '<p class="ystrip-foot">'+
      (sports.length > 1
        ? 'The tile is whichever sport is leading. The letters are your others — '+
          esc(sports.join(', '))+'. Tap a month to set them all.'
        : 'Tap a month to change it.')+
    '</p>'+
  '</div>';
}

/* ---------- today's grid, for comparison ---------- */
function oldViewHTML(){
  const m = ym();
  const planned = plannedSports().map(s => s.name);
  let g = '<div class="yog"><div></div>'+
    ACADEMIC.map(x => '<div class="yog-mhead">'+x.slice(0,1)+'</div>').join('');
  (m.sports||[]).forEach(sp => {
    const ignored = isSignupRow(sp) && planned.indexOf(sp.name) < 0;
    g += '<div class="yog-label'+(ignored?' junk':'')+'" title="'+esc(sp.name)+'">'+esc(sp.name)+
         (ignored?'<span class="junk-tag">ignored</span>':'')+'</div>';
    g += ACADEMIC.map(month => {
      const rec = monthRec(sp, month);
      const st = rec && rec.state;
      return '<div class="yog-cell '+(st?'ym-'+st:'ghost')+(ignored?' junk':'')+'">'+(st?PHASE_EMOJI[st]:'')+'</div>';
    }).join('');
  });
  g += '</div>';
  return '<div class="card"><p class="eyebrow">Plan your months — as it is today</p>'+g+'</div>';
}

/* ---------- the month sheet: every sport at once ---------- */
function openMonth(month){
  openMonthName = month;
  renderSheet();
  document.getElementById('bd').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMonth(){
  openMonthName = null;
  document.getElementById('bd').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow = '';
  render();
}
function sheetSports(){
  // Every row the athlete owns, sign-up rows included but marked — so the one
  // place they can be fixed is the place they are visible.
  return (ym().sports||[]);
}
function renderSheet(){
  const month = openMonthName;
  if(!month) return;
  const comps = compsIn(month);
  let html = '<h2>'+esc(month)+'</h2>'+
    '<p class="lede">What is each sport doing this month? This is the whole month in one place — '+
      'the season above rebuilds itself from it.</p>';
  sheetSports().forEach((sp, i) => {
    const rec = monthRec(sp, month);
    const cur = rec && rec.state || '';
    const cur2 = rec && rec.state2 || '';
    const junk = isSignupRow(sp);
    html += '<div class="sp-row">'+
      '<div class="sp-name"><span>'+esc(sp.name)+(junk?'<span class="junk-tag">sign-up row</span>':'')+'</span>'+
        (cur ? '<button class="sp-half" onclick="toggleHalf('+i+')">'+(cur2?'– one setting':'+ split the month')+'</button>' : '')+
      '</div>'+
      '<div class="pills">'+
        STATES.map(s => '<button class="pill'+(cur===s?' sel':'')+'" data-s="'+s+'" onclick="setState('+i+',\''+s+'\')">'+
          PHASE_EMOJI[s]+' '+STATE_LABEL[s]+'</button>').join('')+
        (cur ? '<button class="pill" onclick="setState('+i+',\'\')">Clear</button>' : '')+
      '</div>'+
      (cur2 ? '<div class="pills2"><span class="lab">From the 16th</span><div class="pills">'+
        STATES.map(s => '<button class="pill'+(cur2===s?' sel':'')+'" data-s="'+s+'" onclick="setState2('+i+',\''+s+'\')">'+
          PHASE_EMOJI[s]+' '+STATE_LABEL[s]+'</button>').join('')+'</div></div>' : '')+
    '</div>';
  });
  html += '<div class="sheet-sec"><p>What you’re building</p>'+
    '<p class="hint">One answer for the month, not one per sport — this is the training you add '+
      'around whatever your sports are doing.</p>'+
    '<div class="pills">'+COMPONENTS.map(c =>
      '<button class="pill'+(comps.indexOf(c[0])>=0?' sel':'')+'" onclick="toggleComp(\''+c[0]+'\')">'+esc(c[1])+'</button>').join('')+
    '</div></div>';
  html += '<button class="done" onclick="closeMonth()">Done</button>';
  document.getElementById('sheetInner').innerHTML = html;
}
function ensureRec(i){
  const sp = sheetSports()[i];
  sp.monthlyStates = sp.monthlyStates || [];
  let rec = sp.monthlyStates.find(x => x.month === openMonthName);
  if(!rec){ rec = { month: openMonthName, state:'', state2:'', focus:'', note:'' }; sp.monthlyStates.push(rec); }
  return rec;
}
function setState(i, s){ const r = ensureRec(i); r.state = s; if(!s) r.state2=''; renderSheet(); }
function setState2(i, s){ const r = ensureRec(i); r.state2 = s; renderSheet(); }
function toggleHalf(i){ const r = ensureRec(i); r.state2 = r.state2 ? '' : (r.state || 'maintain'); renderSheet(); }
function toggleComp(id){
  const m = ym(); m._monthComps = m._monthComps || {};
  const cur = (m._monthComps[openMonthName] || compsIn(openMonthName)).slice();
  const at = cur.indexOf(id);
  if(at >= 0) cur.splice(at,1); else { if(cur.length >= 3) return; cur.push(id); }
  m._monthComps[openMonthName] = cur;
  renderSheet();
}

/* ---------- chrome ---------- */
function setWho(id){ who = id; render(); }
function setView(v){ view = v; render(); }
function setGrouping(g){ grouping = g; render(); }
function blockCountFor(g){
  const was = grouping; grouping = g;
  const n = blocks().length; grouping = was; return n;
}
function dataNoteHTML(){
  const all = ym().sports || [];
  const junk = all.filter(isSignupRow);
  if(!junk.length) return '';
  const planned = plannedSports().map(s => s.name);
  const ignored = junk.filter(s => planned.indexOf(s.name) < 0);
  const months = ignored.reduce((a,s) => a + (s.monthlyStates||[]).filter(m=>m.state).length, 0);
  return '<div class="note"><b>Found in this athlete’s real data:</b> '+junk.length+
    ' row'+(junk.length>1?'s':'')+' whose name is a list of sports — typed into one box on the sign-up form, '+
    'then stored as if it were a sport.'+
    (months ? ' <b>'+months+' months of planning sit in '+(ignored.length>1?'those rows':'that row')+
      ' and the season ignores every one of them</b>, because real sports have been planned too.'
            : ' It is the only row with any planning, so the season is read from it.')+
    '</div>';
}
function render(){
  document.getElementById('whoBar').innerHTML = Object.keys(MAPS).map(id =>
    '<button class="chip'+(id===who?' on':'')+'" onclick="setWho(\''+id+'\')">'+id+
      ' <span style="opacity:.65">· '+(MAPS[id].sports||[]).length+' rows</span>'+
      (id==='62' ? ' <span class="flag">grouping differs</span>' : '')+'</button>').join(' ');
  document.getElementById('vStrip').classList.toggle('on', view==='strip');
  document.getElementById('vAth').classList.toggle('on', view==='ath');
  document.getElementById('vNew').classList.toggle('on', view==='new');
  document.getElementById('gSport').classList.toggle('on', grouping==='sport');
  document.getElementById('gWork').classList.toggle('on', grouping==='work');
  document.getElementById('groupBar').style.display = view==='new' ? '' : 'none';
  const nS = blockCountFor('sport'), nW = blockCountFor('work');
  document.getElementById('gSport').innerHTML = 'Leading sport <span style="opacity:.65">· '+nS+' blocks</span>';
  document.getElementById('gWork').innerHTML  = 'Kind of work <span style="opacity:.65">· '+nW+' blocks</span>';
  document.getElementById('groupSame').innerHTML = (nS === nW)
    ? '<span class="same">Identical for this athlete — only 62 differs</span>'
    : '<span class="diff">'+(nS-nW)+' fewer blocks →</span>';
  document.getElementById('vOld').classList.toggle('on', view==='old');
  document.getElementById('dataNote').innerHTML = dataNoteHTML();
  document.getElementById('main').innerHTML =
    view === 'strip' ? yearStripHTML() :
    view === 'ath' ? athleteViewHTML() : view === 'new' ? newViewHTML() : oldViewHTML();
}
render();
</script>
