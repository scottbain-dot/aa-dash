<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where you are now — prototype</title>
<!--
  PROTOTYPE. Nothing saves, nothing is wired to a portal.

  The year view answers "when". A student who cannot see where they are does not
  need a better "when" — they need what can I do, what holds it up, what is next.

  Each rung says the same four things in the same order, so there is nothing new
  to learn after the first one:
      what you can do  ·  where that sits  ·  which way it is going  ·  what
      you are doing about it right now.

  The rungs SUPPORT each other, they do not gate each other. Sprinting is the
  best thing for sprinting; strength underneath raises the ceiling. The single
  genuine gate is technique before load — you do not load a pattern that is not
  stamped.

  Two profiles: athlete 41's real record pulled by ID, and a worked example with
  a full battery. No names, no emails.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#874B46; --burgundy-dark:#6a3a36; --gold:#D4AF37; --gold-light:#f5e6b3;
    --ink:#1f1b19; --ink-soft:#4a3f39; --ink-mute:#7a6a60; --cream:#fdf6f2; --line:#eee3dd;
    --green:#4a7c52; --amber:#b5882c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#fef8f6;color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding-bottom:60px}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 4px}
  .sub{font-size:13px;color:var(--ink-mute);margin:0 0 14px;line-height:1.5}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
  .bar-lab{font:800 10.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);width:100%}
  .chip{font:600 12.5px 'Inter';background:#fff;border:1.5px solid var(--line);border-radius:999px;
        padding:7px 12px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .eyebrow{font:800 11px 'Inter';letter-spacing:.09em;text-transform:uppercase;color:var(--burgundy);margin:0 0 10px}

  /* ---- the stack ---- */
  .rung{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:0;
        cursor:pointer;text-align:left;width:100%;font:inherit;display:block}
  .rung.lead{border-color:var(--burgundy);box-shadow:0 0 0 1px var(--burgundy)}
  .rung.untested{background:#fbf7f5;border-style:dashed}
  .rung-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .rung-name{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:700}
  .rung-what{font:500 11.5px 'Inter';color:var(--ink-mute);margin:2px 0 9px;line-height:1.45}
  .rung-val{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:700;line-height:1}
  .rung-val small{font-size:12px;font-weight:400;color:var(--ink-mute);font-family:'Inter'}
  .rung-none{font:600 13px 'Inter';color:var(--ink-mute)}
  .lvl{display:flex;gap:3px;align-items:center;margin:7px 0 0}
  .lvl i{width:22px;height:7px;border-radius:2px;background:#ece2dc;display:block}
  .lvl i.on{background:var(--ink)}
  .lvl span{font:700 10.5px 'Inter';color:var(--ink-mute);margin-left:5px}
  .rung-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
  .tag{font:700 10.5px 'Inter';border-radius:999px;padding:3px 9px;letter-spacing:.02em}
  .t-up{background:#e7efe4;color:var(--green)}
  .t-flat{background:#f1ebe7;color:var(--ink-mute)}
  .t-doing{background:var(--ink);color:#fff}
  .t-hold{background:#efe7e2;color:#6a5c53}
  .t-none{background:transparent;color:var(--ink-mute);border:1px solid var(--line)}
  .rung-next{font:600 12px 'Inter';color:var(--burgundy);margin:9px 0 0;line-height:1.45}
  .rung-next span{font-weight:400;color:var(--ink-soft)}

  .joint{display:flex;align-items:center;gap:8px;padding:7px 0 7px 16px;font:600 11px 'Inter';color:var(--ink-mute)}
  .joint b{color:var(--ink-soft);font-weight:700}
  .joint-arrow{color:var(--ink-mute);font-size:13px}
  .gate{background:#fdf7e8;border:1px solid var(--gold-light);border-left:3px solid var(--gold);
        border-radius:10px;padding:9px 12px;font:500 12px 'Inter';color:var(--ink-soft);line-height:1.5;margin:7px 0}
  .gate b{color:var(--burgundy-dark)}

  .side-head{font:800 10.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);
             margin:20px 0 9px}
  .gears{display:flex;gap:5px;margin-top:8px}
  .gear{flex:1;text-align:center;border-radius:9px;padding:7px 3px;background:#f6efeb;border:1px dashed var(--line)}
  .gear.has{background:var(--ink);border-style:solid;border-color:var(--ink);color:#fff}
  .gear b{display:block;font:700 10.5px 'Inter'}
  .gear span{font:500 9.5px 'Inter';opacity:.75}

  .ta{background:linear-gradient(160deg,#2b2521,#3a312b);color:#f7f1ec;border:none}
  .ta .eyebrow{color:var(--gold)}
  .ta-num{font-family:'Fraunces',Georgia,serif;font-size:40px;font-weight:700;line-height:1}
  .ta-num small{font-size:15px;opacity:.6}
  .ta-sub{font-size:12.5px;color:rgba(247,241,236,.78);margin:6px 0 0;line-height:1.5}
  .ta-parts{display:flex;gap:14px;margin-top:13px;flex-wrap:wrap}
  .ta-part b{display:block;font-family:'Fraunces',serif;font-size:17px}
  .ta-part span{font:600 9.5px 'Inter';letter-spacing:.05em;text-transform:uppercase;opacity:.6}
  .note{background:#fdf7e8;border:1px solid var(--gold-light);border-radius:10px;padding:10px 12px;
        font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Where you are now</h1>
  <p class="sub">Prototype. Nothing saves. Athlete 41 is a real record pulled by ID; the example has a full
     test battery so the view can be judged with something in it.</p>

  <div class="bar">
    <span class="bar-lab">Profile</span>
    <button class="chip on" id="pMe" onclick="setWho('me')">Athlete 41 · real</button>
    <button class="chip" id="pEx" onclick="setWho('ex')">Worked example</button>
  </div>

  <div id="main"></div>
</div>

<script>
/* ============================================================
   DATA — athlete 41's real record, and a worked example.
   ============================================================ */
const PROFILES = {
  me: {
    id: '41', gender: 'M',
    strengthLevels: [
      { pattern:'Squat', tech:2, load:1, done:true },
      { pattern:'Push',  tech:2, load:1, done:true },
      { pattern:'Pull',  tech:2, load:2, done:true },
      { pattern:'Hinge', tech:2, load:2, done:true },
      { pattern:'Lunge', tech:2, load:2, done:true },
      { pattern:'Press', tech:2, load:2, done:true }
    ],
    testing: [
      { key:'broad_jump', label:'Broad jump',     unit:'cm', done:false },
      { key:'sprint_40m', label:'40m sprint',     unit:'s',  done:false },
      { key:'agility',    label:'5-10-5 agility', unit:'s',  done:false },
      { key:'cooper',     label:'Cooper 12 min',  unit:'m',  done:false }
    ],
    building: ['strength'], holding: []
  },
  ex: {
    id: '—', gender: 'M',
    strengthLevels: [
      { pattern:'Squat', tech:4, load:3, done:true },
      { pattern:'Push',  tech:3, load:2, done:true },
      { pattern:'Pull',  tech:2, load:0, done:true },
      { pattern:'Hinge', tech:0, load:0, done:false },
      { pattern:'Lunge', tech:3, load:3, done:true },
      { pattern:'Press', tech:0, load:0, done:false }
    ],
    testing: [
      { key:'broad_jump', label:'Broad jump', unit:'cm', done:true, value:212, date:'2026-09-02', tests:2, first:198 },
      { key:'sprint_40m', label:'40m sprint', unit:'s',  done:true, value:5.82, date:'2026-09-02', tests:2, first:6.11 },
      { key:'agility',    label:'5-10-5 agility', unit:'s', done:false },
      { key:'cooper',     label:'Cooper 12 min',  unit:'m', done:true, value:2480, date:'2026-06-14', tests:1, first:null }
    ],
    building: ['speed'], holding: ['endurance']
  }
};

let who = 'me';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P = () => PROFILES[who];

/* ---- levels ------------------------------------------------------------
   The same thresholds the dashboard uses. NOTE: those functions return 4 for
   two adjacent bands, so level 4 is twice as wide as the others and level 5
   only opens at the top threshold. Reproduced here deliberately so this view
   matches the rest of the system — worth a decision before it ships. */
const T = {
  broad_jump: { M:[160,180,200,220,240], F:[130,145,155,165,180], higher:true },
  sprint_40m: { M:[6.5,6.0,5.5,5.0,4.8], F:[7.5,7.0,6.5,6.0,5.7], higher:false },
  agility:    { M:[5.5,5.1,4.8,4.5,4.2], F:[6.0,5.6,5.3,5.0,4.7], higher:false },
  cooper:     { M:[1600,2000,2400,2800,3000], F:[1200,1600,2000,2400,2600], higher:true }
};
function levelFor(key, v, gender){
  const c = T[key]; if(!c || !v) return 0;
  const t = c[gender === 'F' ? 'F' : 'M'];
  if(c.higher){ if(v<t[0])return 1; if(v<t[1])return 2; if(v<t[2])return 3; if(v<t[3])return 4; if(v<t[4])return 4; return 5; }
  if(v>t[0])return 1; if(v>t[1])return 2; if(v>t[2])return 3; if(v>t[3])return 4; if(v>t[4])return 4; return 5;
}
// Strength: the house formula — per pattern (tech + load)/2 when both are there,
// otherwise whichever exists; divided by six so unassessed patterns pull it down.
function strengthScore(){
  const L = P().strengthLevels || [];
  let sum = 0;
  ['Squat','Hinge','Push','Pull','Lunge','Press'].forEach(function(p){
    const r = L.find(x => x.pattern === p) || {};
    const tech = +r.tech || 0, load = +r.load || 0;
    sum += (tech && load) ? (tech + load) / 2 : (tech || load || 0);
  });
  return sum / 6;
}
const testOf = k => (P().testing || []).find(t => t.key === k) || { done:false };
// What it takes to reach the next level. The level-4 band is two thresholds
// wide (see the note above), so the step out of 4 is the top threshold, not
// the next one along — reading t[level] gives an answer that is already true.
function nextStep(key, level, gender){
  const c = T[key]; if(!c || !level || level >= 5) return '';
  const t = c[gender === 'F' ? 'F' : 'M'];
  const target = level === 4 ? t[4] : t[level - 1];
  const unit = key === 'sprint_40m' || key === 'agility' ? 's' : (key === 'cooper' ? 'm' : 'cm');
  return c.higher ? 'Reach <strong>' + target + unit + '</strong> for Level ' + (level + 1)
                  : 'Get under <strong>' + target + unit + '</strong> for Level ' + (level + 1);
}
const fmtDate = d => d ? new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'numeric'}) : '';

/* ---- one rung ---------------------------------------------------------- */
function lvlBar(n){
  let h = '<span class="lvl">';
  for(let i=1;i<=5;i++) h += '<i class="'+(i<=n?'on':'')+'"></i>';
  return h + '<span>Level '+n+' of 5</span></span>';
}
function statusTag(id){
  if((P().building||[]).indexOf(id) >= 0) return '<span class="tag t-doing">Building this block</span>';
  if((P().holding||[]).indexOf(id) >= 0)  return '<span class="tag t-hold">Holding it</span>';
  return '<span class="tag t-none">Not training this</span>';
}
function trendTag(t){
  if(!t.done) return '';
  if(t.first == null || t.tests < 2) return '<span class="tag t-flat">First test — nothing to compare yet</span>';
  const better = T[t.key].higher ? t.value > t.first : t.value < t.first;
  const diff = Math.abs(Math.round((t.value - t.first) * 100) / 100);
  return '<span class="tag '+(better?'t-up':'t-flat')+'">'+(better?'↑ ':'')+diff+(t.unit||'')+
         ' since your first test</span>';
}
function rungHTML(o){
  const cls = 'rung' + (o.lead ? ' lead' : '') + (o.untested ? ' untested' : '');
  return '<div class="'+cls+'">'+
    '<div class="rung-top"><span class="rung-name">'+esc(o.name)+'</span>'+
      (o.value ? '<span class="rung-val">'+o.value+'</span>' : '<span class="rung-none">Not tested yet</span>')+
    '</div>'+
    '<p class="rung-what">'+o.what+'</p>'+
    (o.level ? lvlBar(o.level) : '')+
    '<div class="rung-row">'+(o.trend||'')+o.status+'</div>'+
    (o.next ? '<p class="rung-next">'+o.next+'</p>' : '')+
  '</div>';
}
function joint(text){
  return '<div class="joint"><span class="joint-arrow">↑</span><span>'+text+'</span></div>';
}

/* ---- the view ---------------------------------------------------------- */
function render(){
  document.getElementById('pMe').classList.toggle('on', who==='me');
  document.getElementById('pEx').classList.toggle('on', who==='ex');

  const g = P().gender;
  const L = P().strengthLevels || [];
  const stamped = L.filter(x => (+x.tech||0) >= 2).length;
  const sStr = strengthScore();
  const bj = testOf('broad_jump'), sp = testOf('sprint_40m'),
        ag = testOf('agility'),    co = testOf('cooper');

  let h = '';

  // Training Age — the thing all of this has always been feeding.
  const physParts = [sStr, bj.done?levelFor('broad_jump',bj.value,g):0,
                     sp.done?levelFor('sprint_40m',sp.value,g):0,
                     ag.done?levelFor('agility',ag.value,g):0,
                     co.done?levelFor('cooper',co.value,g):0].filter(x=>x>0);
  const phys = physParts.length ? physParts.reduce((a,b)=>a+b,0)/physParts.length : 0;
  h += '<div class="card ta"><p class="eyebrow">Training age</p>'+
    '<p class="ta-num">'+(phys?phys.toFixed(1):'—')+'<small> / 5 · physical</small></p>'+
    '<p class="ta-sub">Built from the rungs below. Every test you take and every level you pass '+
      'moves this number — it is the one score that says how far along you are as an athlete.</p>'+
    '<div class="ta-parts">'+
      '<span class="ta-part"><b>'+sStr.toFixed(1)+'</b><span>strength</span></span>'+
      '<span class="ta-part"><b>'+(bj.done?levelFor('broad_jump',bj.value,g):'—')+'</b><span>power</span></span>'+
      '<span class="ta-part"><b>'+(sp.done?levelFor('sprint_40m',sp.value,g):'—')+'</b><span>speed</span></span>'+
      '<span class="ta-part"><b>'+(ag.done?levelFor('agility',ag.value,g):'—')+'</b><span>change of direction</span></span>'+
      '<span class="ta-part"><b>'+(co.done?levelFor('cooper',co.value,g):'—')+'</b><span>engine</span></span>'+
    '</div></div>';

  h += '<div class="card"><p class="eyebrow">What you can do</p>';

  // SPEED
  h += rungHTML({
    name:'Speed', what:'Top-end running. How fast you are once you are moving.',
    value: sp.done ? sp.value+'<small>s</small>' : '', level: sp.done?levelFor('sprint_40m',sp.value,g):0,
    untested: !sp.done, lead:(P().building||[]).indexOf('speed')>=0,
    trend: trendTag(sp), status: statusTag('speed'),
    next: sp.done ? (nextStep('sprint_40m', levelFor('sprint_40m',sp.value,g), g) || 'Top level — hold it.')
                  : 'Next: <span>get a 40m time at the next testing week — then this stops being a blank.</span>'
  });
  h += joint('Sprinting is the best thing for sprinting. <b>Power underneath raises the ceiling.</b>');

  // POWER
  h += rungHTML({
    name:'Power', what:'Strength, fast. Jumping, throwing, your first two steps.',
    value: bj.done ? bj.value+'<small>cm</small>' : '', level: bj.done?levelFor('broad_jump',bj.value,g):0,
    untested: !bj.done, lead:(P().building||[]).indexOf('power')>=0,
    trend: trendTag(bj), status: statusTag('power'),
    next: bj.done ? (nextStep('broad_jump', levelFor('broad_jump',bj.value,g), g) || 'Top level — hold it.')
                  : 'Next: <span>a broad jump takes two minutes to measure.</span>'
  });
  h += joint('Jumps and throws move this directly. <b>Strength underneath raises the ceiling.</b>');

  // STRENGTH
  const weakest = ['Squat','Hinge','Push','Pull','Lunge','Press']
    .map(p => Object.assign({pattern:p}, L.find(x=>x.pattern===p)||{}))
    .sort((a,b)=>((+a.tech||0)+(+a.load||0))-((+b.tech||0)+(+b.load||0)))[0];
  h += rungHTML({
    name:'Strength', what:'How much you can move, across the six patterns.',
    value: sStr ? sStr.toFixed(1)+'<small> / 5</small>' : '', level: Math.round(sStr),
    untested: !sStr, lead:(P().building||[]).indexOf('strength')>=0,
    trend:'', status: statusTag('strength'),
    next: weakest && (+weakest.tech||0) < 2
      ? 'Next: <span><strong>'+esc(weakest.pattern)+'</strong> is not stamped yet — that one is holding the score down.</span>'
      : 'Next: <span><strong>'+esc(weakest.pattern)+'</strong> is your lowest. Move that and the whole score moves.</span>'
  });
  h += joint('<b>This is the one that lifts everything else.</b> It is also the slowest — give it 6–8 weeks.');

  // MOVE WELL — the only real gate in the stack
  h += rungHTML({
    name:'Move well', what:'The six movements, signed off by your coach. Technique 1 to 5.',
    value: stamped+'<small> of 6</small>', level: 0, untested: stamped===0,
    trend: stamped===6 ? '<span class="tag t-up">All six stamped</span>' : '',
    status: '<span class="tag t-none">Stamped at a check-in</span>',
    next: stamped < 6 ? 'Next: <span>'+(6-stamped)+' still to get signed off. Book a check-in.</span>'
                      : 'Next: <span>all six at technique 2. Level 3 unlocks heavier work.</span>'
  });
  h += '<div class="gate"><b>The one real rule:</b> a movement has to be stamped before you load it. '+
       'Everything above this supports everything else — none of it is locked.</div>';
  h += '</div>';

  // The two that sit alongside rather than on top.
  h += '<div class="card"><p class="eyebrow">Alongside</p>';
  h += rungHTML({
    name:'Change of direction', what:'Stopping, turning, going again. Built on strength and mobility.',
    value: ag.done ? ag.value+'<small>s</small>' : '', level: ag.done?levelFor('agility',ag.value,g):0,
    untested: !ag.done, lead:(P().building||[]).indexOf('mds')>=0,
    trend: trendTag(ag), status: statusTag('mds'),
    next: ag.done ? nextStep('agility', levelFor('agility',ag.value,g), g)
                  : 'Next: <span>the 5-10-5 takes one run to measure.</span>'
  });
  h += '<p class="side-head">Engine</p>';
  h += rungHTML({
    name:'Engine', what:'How long you last, and how fast you can last. Three gears.',
    value: co.done ? co.value+'<small>m</small>' : '', level: co.done?levelFor('cooper',co.value,g):0,
    untested: !co.done, lead:(P().building||[]).indexOf('endurance')>=0,
    trend: trendTag(co), status: statusTag('endurance'),
    next: co.done ? nextStep('cooper', levelFor('cooper',co.value,g), g)
                  : 'Next: <span>Cooper 12-minute run at the next testing week.</span>'
  });
  h += '<div class="gears">'+
    '<span class="gear'+(co.done?' has':'')+'"><b>Base</b><span>'+(co.done?'Cooper · tested':'not tested')+'</span></span>'+
    '<span class="gear"><b>Threshold</b><span>no test yet</span></span>'+
    '<span class="gear"><b>Top end</b><span>no test yet</span></span>'+
  '</div>'+
  '<p class="rung-what" style="margin-top:9px">Fuel Lab already teaches the three energy systems. Only the '+
    'base is measured — threshold and top end would each need a test adding.</p>';
  h += '</div>';

  document.getElementById('main').innerHTML = h;
}
function setWho(w){ who = w; render(); }
render();
</script>
</body>
</html>
